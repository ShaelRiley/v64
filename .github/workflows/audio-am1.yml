name: V64 AM1 audio, container, playback, and bitrate gates

on:
  pull_request:
    paths:
      - "prototype/js/audio-am1.mjs"
      - "prototype/js/audio-opus.mjs"
      - "prototype/js/audio-run.mjs"
      - "prototype/js/audio-decode.mjs"
      - "prototype/js/audio-preprocess.mjs"
      - "prototype/js/opus-packet.mjs"
      - "prototype/js/container.mjs"
      - "tests/audio-am1.test.mjs"
      - "tests/audio-opus.test.mjs"
      - "tests/audio-run.test.mjs"
      - "tests/audio-decode.test.mjs"
      - "tests/audio-preprocess.test.mjs"
      - "tools/build-am1-fixtures.mjs"
      - "tools/benchmark-am1-bitrates.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v64-audio-am1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audio-am1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg and libopus
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libopus0

      - name: Run repository tests
        run: npm test

      - name: Generate deterministic AM1 fixture
        run: npm run --silent audio:fixtures

      - name: Verify generated manifest, container, and playback
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("bench/generated/am1/manifest.json", "utf8"));
          assert.equal(manifest.format, "V64-AM1-FIXTURE-4");
          assert.equal(manifest.sampleRate, 48000);
          assert.equal(manifest.channels, 1);
          assert.equal(manifest.samples, 96000);
          assert.equal(manifest.wavBytes, 192044);
          assert.equal(
            manifest.wavSha256,
            "cb98b4184e0c5f69ab296b80c94b71b9896f5e44cff6e76dd0ec6d957f237c89"
          );
          assert.deepEqual(manifest.silenceSpans, [
            { startSample: 12000, endSample: 31200 },
            { startSample: 69600, endSample: 96000 }
          ]);
          assert.deepEqual(manifest.silenceChunks, [
            { type: "SILN", timestamp: 15000, duration: 24000, payloadBytes: 0 },
            { type: "SILN", timestamp: 87000, duration: 33000, payloadBytes: 0 }
          ]);
          assert.equal(manifest.opus.bitrateKbps, 8);
          assert.equal(manifest.opus.frameDurationMs, 20);
          assert.equal(manifest.opus.runs.length, 2);
          assert.equal(manifest.opus.accountedSamples, 96000);
          assert.ok(manifest.opus.runs.every((run) =>
            run.preSkip === 312 && run.keptSamples === run.endSample - run.startSample &&
            run.packetSamples.every((samples) => samples === 960) &&
            run.aurnPayloadBytes > run.packetStreamBytes));
          assert.equal(manifest.container.filename, "am1-container.v64");
          assert.equal(manifest.container.audioFeatureDeclared, true);
          assert.equal(manifest.container.verification.valid, true);
          assert.equal(manifest.container.verification.frames, 48);
          assert.equal(manifest.container.verification.audioRuns, 2);
          assert.equal(manifest.container.verification.audioSilenceSpans, 2);
          assert.equal(manifest.container.verification.audioKeptSamples, 50400);
          assert.equal(manifest.container.verification.durationTicks, 120000);
          assert.equal(
            readFileSync("bench/generated/am1/am1-container.v64").length,
            manifest.container.bytes
          );
          assert.equal(manifest.playback.filename, "am1-decoded.pcm");
          assert.equal(manifest.playback.samples, 96000);
          assert.equal(manifest.playback.bytes, 192000);
          assert.equal(manifest.playback.runs.length, 2);
          assert.equal(manifest.playback.silenceSpans.length, 2);
          assert.equal(manifest.playback.seekWindows.length, 5);
          assert.ok(manifest.playback.seekWindows.every((window) =>
            window.matchesFullDecode === true));
          assert.equal(
            readFileSync("bench/generated/am1/am1-decoded.pcm").length,
            manifest.playback.bytes
          );
          NODE

      - name: Run preprocessing and 4/8/12/16 kbit/s sweep
        run: npm run --silent bench:audio-bitrates

      - name: Verify preprocessing and blind sweep
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const directory = "bench/results/am1-bitrate-sweep";
          const preprocess = JSON.parse(readFileSync(`${directory}/preprocess-summary.json`, "utf8"));
          const publicManifest = JSON.parse(readFileSync(`${directory}/public-manifest.json`, "utf8"));
          const key = JSON.parse(readFileSync(`${directory}/key.json`, "utf8"));
          assert.equal(preprocess.format, "V64-AM1-PREPROCESS-SUMMARY-1");
          assert.equal(preprocess.source.sampleRate, 44100);
          assert.equal(preprocess.source.channels, 2);
          assert.equal(preprocess.output.sampleRate, 48000);
          assert.equal(preprocess.output.channels, 1);
          assert.equal(preprocess.output.samples, 96000);
          assert.equal(preprocess.output.wavBytes, 192044);
          const metrics = Object.fromEntries(preprocess.output.segmentMetrics.map((row) => [row.id, row]));
          assert.ok(metrics["low-80hz"].rms < metrics["mid-1khz"].rms * 0.40);
          assert.ok(metrics["high-8khz"].rms < metrics["mid-1khz"].rms * 0.60);
          assert.ok(metrics["loud-1khz"].rms / metrics["quiet-1khz"].rms < 7);
          assert.ok(Math.max(...Object.values(metrics).map((row) => row.peak)) <= 0.90);
          assert.equal(publicManifest.format, "V64-AM1-BITRATE-REVIEW-PUBLIC-1");
          assert.equal(publicManifest.variants.length, 4);
          assert.equal(key.format, "V64-AM1-BITRATE-REVIEW-KEY-1");
          assert.deepEqual(key.variants.map((row) => row.bitrateKbps).sort((a, b) => a - b), [4, 8, 12, 16]);
          assert.ok(key.variants.every((row) =>
            row.keptSamples === 96000 && row.packets === 101 &&
            row.aurnPayloadBytes > row.packetDataBytes &&
            Number.isFinite(row.comparison.snrDb)));
          NODE

      - name: Upload deterministic AM1 fixture
        uses: actions/upload-artifact@v4
        with:
          name: am1-deterministic-fixture
          if-no-files-found: error
          retention-days: 30
          path: bench/generated/am1

      - name: Upload blind bitrate review
        uses: actions/upload-artifact@v4
        with:
          name: am1-bitrate-sweep-blind
          if-no-files-found: error
          retention-days: 30
          path: |
            bench/results/am1-bitrate-sweep
            !bench/results/am1-bitrate-sweep/key.json

      - name: Upload concealed bitrate key
        uses: actions/upload-artifact@v4
        with:
          name: am1-bitrate-sweep-key
          if-no-files-found: error
          retention-days: 30
          path: bench/results/am1-bitrate-sweep/key.json
