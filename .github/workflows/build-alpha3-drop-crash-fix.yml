name: Build alpha.3 Video64 Drop crash-fix assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-alpha3-drop-crash-fix.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-alpha.3
      TESTED_SOURCE_SHA: 0bffc10adaa75e0ab0615f1fc85f3ac00e991c9b
    steps:
      - name: Check out the exact merged crash fix
        uses: actions/checkout@v4
        with:
          ref: 0bffc10adaa75e0ab0615f1fc85f3ac00e991c9b
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy

      - name: Install Linux and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libopus-dev libsdl2-dev xvfb

      - name: Test and build current Linux applications
        run: |
          set -euo pipefail
          npm --prefix apps/video64-drop test
          rustfmt --edition 2024 --check \
            apps/video64-drop-native/src/lib.rs \
            apps/video64-drop-native/src/main.rs
          cargo test --locked --package v64-player --features native-ui
          cargo test --locked --package video64-drop-native --features native-ui
          cargo clippy --locked --package video64-drop-native --all-targets --features native-ui -- -D warnings
          cargo build --locked --release --package v64-player --features native-ui
          cargo build --locked --release --package video64-drop-native --features native-ui

      - name: Generate current audiovisual test source
        run: |
          set -euo pipefail
          mkdir -p dist/sample-preview
          ffmpeg -y -v error \
            -f lavfi -i testsrc2=size=320x180:rate=24:duration=4 \
            -f lavfi -i sine=frequency=660:sample_rate=48000:duration=4 \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -ac 1 -ar 48000 \
            dist/video64-alpha3-source.mp4

      - name: Generate estimate, preview, encoded sample, and verification
        run: |
          set -euo pipefail
          node apps/video64-drop/cli.mjs estimate \
            dist/video64-alpha3-source.mp4 \
            --columns 40 --palette 16 --glyphs 32 --profile balanced \
            > dist/video64-alpha3-estimate.json
          node apps/video64-drop/cli.mjs preview \
            dist/video64-alpha3-source.mp4 dist/sample-preview \
            --columns 40 --palette 16 --glyphs 32 --profile balanced \
            > dist/video64-alpha3-preview.json
          target/release/video64-drop \
            --core-cli apps/video64-drop/cli.mjs \
            --headless-encode dist/video64-alpha3-source.mp4 \
            dist/video64-alpha3-sample.v64 \
            --headless-report dist/video64-alpha3-encode-report.json
          node prototype/js/cli.mjs verify dist/video64-alpha3-sample.v64 \
            > dist/video64-alpha3-verification.json
          cmp dist/video64-alpha3-preview.json dist/sample-preview/preview.json

      - name: Assemble corrected Linux developer bundles
        run: |
          set -euo pipefail
          mkdir -p \
            release/video64-player-linux-x86_64 \
            release/video64-drop-linux-x86_64/apps \
            release/video64-alpha3-sample

          install -m 0755 target/release/v64-player \
            release/video64-player-linux-x86_64/v64-player
          cp LICENSE README.md docs/NATIVE_PLAYER.md \
            release/video64-player-linux-x86_64/

          install -m 0755 target/release/video64-drop \
            release/video64-drop-linux-x86_64/video64-drop
          cp -R apps/video64-drop \
            release/video64-drop-linux-x86_64/apps/
          cp -R prototype assets tools \
            release/video64-drop-linux-x86_64/
          cp package.json LICENSE README.md \
            release/video64-drop-linux-x86_64/
          cp apps/video64-drop-native/README.md \
            release/video64-drop-linux-x86_64/NATIVE-SHELL-README.md
          cat > release/video64-drop-linux-x86_64/run-video64-drop.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$here/video64-drop" "$@"
          SH
          chmod 0755 release/video64-drop-linux-x86_64/run-video64-drop.sh
          cat > release/video64-drop-linux-x86_64/RUNTIME-REQUIREMENTS.txt <<'TXT'
          Linux x86_64 developer bundle.
          Requires Node.js 20+, FFmpeg/FFprobe, and SDL2 at runtime.
          The executable now discovers its bundled application core automatically.
          Dropped-file planning errors remain visible in the window and do not close the app.
          AM1 source-audio encoding remains provisional pending blinded listening.
          TXT

          cp dist/video64-alpha3-source.mp4 \
            dist/video64-alpha3-sample.v64 \
            dist/video64-alpha3-estimate.json \
            dist/video64-alpha3-preview.json \
            dist/video64-alpha3-encode-report.json \
            dist/video64-alpha3-verification.json \
            dist/sample-preview/source.ppm \
            dist/sample-preview/decoded-v64.ppm \
            dist/sample-preview/comparison.ppm \
            release/video64-alpha3-sample/

      - name: Prove the corrected extracted bundle works directly
        run: |
          set -euo pipefail
          release/video64-drop-linux-x86_64/video64-drop \
            --headless-report dist/video64-alpha3-bundle-report.json \
            dist/video64-alpha3-source.mp4
          xvfb-run -a env SDL_AUDIODRIVER=dummy \
            release/video64-drop-linux-x86_64/video64-drop \
            --smoke-drop dist/video64-alpha3-source.mp4 \
            --smoke-presents 4
          xvfb-run -a env SDL_AUDIODRIVER=dummy \
            release/video64-drop-linux-x86_64/video64-drop \
            --core-cli dist/missing-core.mjs \
            --smoke-drop dist/video64-alpha3-source.mp4 \
            --smoke-presents 4

      - name: Archive bundles
        run: |
          set -euo pipefail
          tar -C release -czf dist/video64-player-linux-x86_64.tar.gz \
            video64-player-linux-x86_64
          tar -C release -czf dist/video64-drop-linux-x86_64.tar.gz \
            video64-drop-linux-x86_64
          tar -C release -czf dist/video64-alpha3-sample-bundle.tar.gz \
            video64-alpha3-sample

      - name: Record manifest, checksums, and release notes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          names = [
              "video64-player-linux-x86_64.tar.gz",
              "video64-drop-linux-x86_64.tar.gz",
              "video64-alpha3-sample-bundle.tar.gz",
              "video64-alpha3-sample.v64",
          ]
          assets = []
          for name in names:
              path = Path("dist") / name
              assets.append({
                  "name": name,
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })

          manifest = {
              "format": "VIDEO64-ALPHA3-RELEASE-MANIFEST-1",
              "project": "Video 64",
              "tag": os.environ["TAG"],
              "testedSourceCommit": os.environ["TESTED_SOURCE_SHA"],
              "prerelease": True,
              "platform": "Linux x86_64",
              "assets": assets,
              "verification": json.loads(Path("dist/video64-alpha3-verification.json").read_text()),
              "bundlePlanning": json.loads(Path("dist/video64-alpha3-bundle-report.json").read_text()),
              "fixed": {
                  "bundledCoreDiscovery": True,
                  "dropPlanningErrorKeepsWindowOpen": True,
              },
              "boundaries": {
                  "am1BitrateFrozen": False,
                  "nativePreviewPresentation": False,
                  "bundledNodeRuntime": False,
                  "windowsPackage": False,
                  "macosPackage": False,
              },
          }
          Path("dist/video64-alpha3-release-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          PY

          (cd dist && sha256sum \
            video64-player-linux-x86_64.tar.gz \
            video64-drop-linux-x86_64.tar.gz \
            video64-alpha3-sample-bundle.tar.gz \
            video64-alpha3-sample.v64 \
            video64-alpha3-release-manifest.json > SHA256SUMS.txt)

          cat > dist/RELEASE-NOTES.md <<EOF
          ## Video 64 v0.1.0-alpha.3

          This prerelease replaces the broken alpha.2 Video64 Drop bundle.

          Fixed:

          - the native executable now discovers the bundled application core relative to itself instead of using the GitHub build machine's compile-time path;
          - dropping an MP4 that cannot be planned now displays an in-window error instead of terminating the SDL event loop and closing the application;
          - permanent CI now launches the exact extracted release layout without a wrapper, drops a real H.264/AAC MP4, and deliberately forces a planning error to prove the window remains alive.

          Tested source commit: \`${TESTED_SOURCE_SHA}\`.

          This remains a Linux x86_64 developer prerelease requiring system Node.js 20+, FFmpeg/FFprobe, and SDL2. AM1 8 kbps remains provisional pending genuine blinded listening. Native preview/estimator presentation, Windows packaging, and macOS packaging are not claimed.
          EOF

      - name: Upload checked alpha.3 assets
        uses: actions/upload-artifact@v4
        with:
          name: video64-alpha3-build
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/video64-player-linux-x86_64.tar.gz
            dist/video64-drop-linux-x86_64.tar.gz
            dist/video64-alpha3-sample-bundle.tar.gz
            dist/video64-alpha3-sample.v64
            dist/video64-alpha3-release-manifest.json
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/video64-alpha3-bundle-report.json
            dist/video64-alpha3-verification.json

      - name: Report exact build result
        if: always()
        run: |
          set -euo pipefail
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Alpha.3 crash-fix build completed.\n\n- result: \`${{ job.status }}\`\n- run ID: \`$GITHUB_RUN_ID\`\n- tested source: \`$TESTED_SOURCE_SHA\`\n- artifact name: \`video64-alpha3-build\`"
