name: Build current native preview estimator

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-native-preview-estimator-current.yml"

permissions:
  contents: write
  issues: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-preview-estimator
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy

      - name: Install native and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsdl2-dev xvfb

      - name: Install current checked implementation and permanent gate
        run: |
          set -euo pipefail
          echo "feature_head=$(git rev-parse HEAD)"
          base64 -d .github/preview-builder/main.rs.gz.b64 | gzip -d > apps/video64-drop-native/src/main.rs
          base64 -d .github/preview-builder/lib.rs.gz.b64 | gzip -d > apps/video64-drop-native/src/lib.rs
          base64 -d .github/preview-builder/video64-drop-native.yml.gz.b64 | gzip -d > .github/workflows/video64-drop-native.yml
          rustfmt --edition 2024 apps/video64-drop-native/src/main.rs apps/video64-drop-native/src/lib.rs

      - name: Test, lint, build, and exercise native preview
        run: |
          set -euo pipefail
          npm --prefix apps/video64-drop test
          rustfmt --edition 2024 --check apps/video64-drop-native/src/lib.rs apps/video64-drop-native/src/main.rs
          cargo test --locked -p video64-drop-native --features native-ui
          cargo clippy --locked -p video64-drop-native --all-targets --features native-ui -- -D warnings
          cargo build --locked --release -p video64-drop-native --features native-ui
          mkdir -p evidence
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=320x180:rate=24 \
            -f lavfi -i sine=frequency=660:sample_rate=48000 \
            -t 4 -shortest -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -ac 1 -ar 48000 evidence/source.mp4
          ./target/release/video64-drop \
            --core-cli apps/video64-drop/cli.mjs \
            --headless-preview evidence/source.mp4 evidence/native-preview \
            --headless-report evidence/native-preview-report.json
          xvfb-run -a env SDL_AUDIODRIVER=dummy \
            ./target/release/video64-drop \
            --core-cli apps/video64-drop/cli.mjs \
            --smoke-preview evidence/source.mp4 \
            --smoke-presents 4 evidence/source.mp4
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('evidence/native-preview-report.json').read_text())
          assert report['format'] == 'VIDEO64-DROP-NATIVE-PREVIEW-1'
          assert report['advisory'] is True
          assert report['exactPostEncodeVerificationAuthoritative'] is True
          estimate = report['estimate']
          assert 0 < estimate['advisoryLowBytes'] <= estimate['centralEstimateBytes'] <= estimate['advisoryHighBytes']
          for name in ('source.ppm', 'decoded-v64.ppm', 'comparison.ppm'):
              assert (Path('evidence/native-preview') / name).is_file()
          PY

      - name: Commit checked native integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/video64-drop-native/src/main.rs \
            apps/video64-drop-native/src/lib.rs \
            .github/workflows/video64-drop-native.yml
          git commit -m "Integrate native preview and size estimation"
          git push origin HEAD:agent/native-preview-estimator

      - name: Report builder result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Current native preview/estimator builder completed.\n\n- run: \`$GITHUB_RUN_ID\`\n- status: \`${{ job.status }}\`\n- checked feature head: \`$(git rev-parse HEAD)\`"