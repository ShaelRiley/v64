name: Build structurally corrected native preview branch

on:
  push:
    branches: [main]
    paths: [".github/workflows/build-native-preview-estimator-v3.yml"]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OUTPUT_BRANCH: agent/native-preview-estimator-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-preview-estimator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsdl2-dev xvfb
      - name: Reconstruct and correct production files
        run: |
          set -euo pipefail
          base64 -d .github/preview-builder/main.rs.gz.b64 | gzip -d > apps/video64-drop-native/src/main.rs
          base64 -d .github/preview-builder/lib.rs.gz.b64 | gzip -d > apps/video64-drop-native/src/lib.rs
          base64 -d .github/preview-builder/video64-drop-native.yml.gz.b64 | gzip -d > .github/workflows/video64-drop-native.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/video64-drop-native/src/main.rs')
          text = p.read_text()
          for old, new in {
              '/estimate/centralEstimateBytes':'/estimate/estimatedBytes',
              '/estimate/advisoryLowBytes':'/estimate/lowerBytes',
              '/estimate/advisoryHighBytes':'/estimate/upperBytes',
              '/sourceImage/path':'/preview/source/path',
              '/decodedImage/path':'/preview/decodedV64/path',
              '/representativeOffsetSeconds':'/preview/representativeOffsetSeconds',
          }.items():
              text = text.replace(old, new)
          lines = text.splitlines(keepends=True)
          token_lines = [i for i, line in enumerate(lines) if 'ppm_token(' in line]
          if len(token_lines) < 4:
              raise SystemExit(f'expected four PPM header tokens, found {len(token_lines)}')
          max_token = token_lines[3]
          whitespace = next((i for i in range(max_token, min(max_token + 60, len(lines)))
                             if 'is_ascii_whitespace' in lines[i]), None)
          if whitespace is not None:
              start = whitespace
              while start > max_token and not lines[start].lstrip().startswith('if '):
                  start -= 1
              depth = 0
              end = None
              for i in range(start, len(lines)):
                  depth += lines[i].count('{') - lines[i].count('}')
                  if i > start and depth == 0:
                      end = i + 1
                      break
              if end is None:
                  raise SystemExit('unable to bound redundant PPM whitespace check')
              if end < len(lines) and lines[end].strip() == 'cursor += 1;':
                  end += 1
              del lines[start:end]
          else:
              increment = next((i for i in range(max_token, min(max_token + 60, len(lines)))
                                if lines[i].strip() == 'cursor += 1;'), None)
              if increment is None:
                  raise SystemExit('unable to locate redundant PPM cursor increment')
              del lines[increment]
          p.write_text(''.join(lines))
          PY
          rustfmt --edition 2024 apps/video64-drop-native/src/main.rs apps/video64-drop-native/src/lib.rs
      - name: Validate implementation
        run: |
          set -euo pipefail
          npm --prefix apps/video64-drop test
          rustfmt --edition 2024 --check apps/video64-drop-native/src/lib.rs apps/video64-drop-native/src/main.rs
          cargo test --locked -p video64-drop-native --features native-ui
          cargo clippy --locked -p video64-drop-native --all-targets --features native-ui -- -D warnings
          cargo build --locked --release -p video64-drop-native --features native-ui
          mkdir -p evidence
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x180:rate=24 -f lavfi -i sine=frequency=660:sample_rate=48000 -t 4 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -ac 1 -ar 48000 evidence/source.mp4
          ./target/release/video64-drop --core-cli apps/video64-drop/cli.mjs --headless-preview evidence/source.mp4 evidence/native-preview --headless-report evidence/native-preview-report.json
          xvfb-run -a env SDL_AUDIODRIVER=dummy ./target/release/video64-drop --core-cli apps/video64-drop/cli.mjs --smoke-preview evidence/source.mp4 --smoke-presents 4 evidence/source.mp4
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/native-preview-report.json').read_text())
          assert r['format']=='VIDEO64-DROP-NATIVE-PREVIEW-1'
          assert r['advisory'] is True and r['exactPostEncodeVerificationAuthoritative'] is True
          e=r['estimate']; assert 0<e['advisoryLowBytes']<=e['centralEstimateBytes']<=e['advisoryHighBytes']
          for n in ('source.ppm','decoded-v64.ppm','comparison.ppm'): assert (Path('evidence/native-preview')/n).is_file()
          PY
      - name: Publish clean branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod/apps/video64-drop-native/src /tmp/prod/.github/workflows
          cp apps/video64-drop-native/src/{main.rs,lib.rs} /tmp/prod/apps/video64-drop-native/src/
          cp .github/workflows/video64-drop-native.yml /tmp/prod/.github/workflows/
          git fetch origin main
          git switch --force-create "$OUTPUT_BRANCH" origin/main
          cp /tmp/prod/apps/video64-drop-native/src/{main.rs,lib.rs} apps/video64-drop-native/src/
          cp /tmp/prod/.github/workflows/video64-drop-native.yml .github/workflows/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/video64-drop-native/src/main.rs apps/video64-drop-native/src/lib.rs .github/workflows/video64-drop-native.yml
          git commit -m "Integrate native preview and size estimation"
          git push --force --set-upstream origin "$OUTPUT_BRANCH"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Native preview v3 builder completed.\n\n- run: \`$GITHUB_RUN_ID\`\n- status: \`${{ job.status }}\`\n- output: \`$OUTPUT_BRANCH\`\n- head: \`$(git rev-parse HEAD)\`"
