name: Clean alpha.4 development branches

on:
  push:
    branches: [main]
    paths: [".github/workflows/build-publish-alpha4.yml"]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release and delete obsolete branches
        run: |
          set -euo pipefail
          gh release view v0.1.0-alpha.4 --repo "$GITHUB_REPOSITORY" >/dev/null
          git push origin --delete \
            agent/native-preview-ui \
            agent/native-preview-estimator \
            agent/clean-native-preview-scaffolding
      - name: Report cleanup
        if: always()
        run: |
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Alpha.4 branch cleanup completed.\n\n- run: \`$GITHUB_RUN_ID\`\n- status: \`${{ job.status }}\`\n- retained branch: \`main\`"