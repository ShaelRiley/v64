name: V64 conformance and visual gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
      candidate6_changed: ${{ steps.diff.outputs.candidate6_changed }}
      sm3_changed: ${{ steps.diff.outputs.sm3_changed }}

    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Classify latest commit
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "candidate6_changed=true" >> "$GITHUB_OUTPUT"
            echo "sm3_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only HEAD^ HEAD)"
          printf '%s\n' "$files"
          code_changed=false
          candidate6_changed=false
          sm3_changed=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ ! "$path" =~ ^bench/results/ &&
                  ! "$path" =~ ^bench/reviews/ &&
                  ! "$path" =~ ^bench/HUMAN_RASTER_TRANCHE_[0-9]+\.md$ &&
                  ! "$path" =~ ^bench/SUBTITLE_MASK_TRANCHE_[0-9]+\.md$ &&
                  "$path" != "IMPLEMENTATION_LEDGER.md" &&
                  "$path" != "spec/V64-design.md" &&
                  "$path" != "docs/PLAYBACK_PROFILE.md" ]]; then
              code_changed=true
            fi
            if [[ "$path" =~ candidate-6 ||
                  "$path" == "tools/build-candidate-6-finalists.mjs" ||
                  "$path" == "tests/candidate6.test.mjs" ||
                  "$path" == "tests/candidate6-interpolation-order.test.mjs" ||
                  "$path" == "tests/candidate-6-finalists.test.mjs" ]]; then
              candidate6_changed=true
            fi
            if [[ "$path" == "prototype/js/subtitle-mask-sm3.mjs" ||
                  "$path" == "tools/benchmark-subtitle-mask-sm3.mjs" ||
                  "$path" == "tests/subtitle-mask-sm3.test.mjs" ]]; then
              sm3_changed=true
            fi
          done <<< "$files"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "candidate6_changed=$candidate6_changed" >> "$GITHUB_OUTPUT"
          echo "sm3_changed=$sm3_changed" >> "$GITHUB_OUTPUT"

  conformance:
    needs: classify
    if: ${{ needs.classify.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Run tests
        run: npm test

      - name: Verify deterministic Hyper Real assets
        run: |
          set -euo pipefail
          rm -rf /tmp/v64-palettes /tmp/v64-candidate5 /tmp/v64-candidate6
          node tools/hyperreal-palette-generator.mjs /tmp/v64-palettes > /tmp/v64-palette-build.json
          node tools/hyperreal-candidate-5-generator.mjs /tmp/v64-candidate5 > /tmp/v64-candidate5-build.json
          node tools/hyperreal-candidate-6-generator.mjs /tmp/v64-candidate6 > /tmp/v64-candidate6-build.json
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          for (const stem of [
            "v64-p256-hyperreal-candidate-2",
            "v64-p256-hyperreal-candidate-3",
            "v64-p256-hyperreal-candidate-4"
          ]) {
            const tracked = JSON.parse(readFileSync(`assets/palettes/${stem}.json`, "utf8"));
            const generated = JSON.parse(readFileSync(`/tmp/v64-palettes/${stem}.json`, "utf8"));
            assert.deepStrictEqual(generated, tracked, `${stem}.json differs semantically`);
          }
          assert.deepStrictEqual(
            readFileSync("/tmp/v64-palettes/v64-p256-hyperreal-candidate-2.rgb"),
            readFileSync("assets/palettes/v64-p256-hyperreal-candidate-2.rgb"),
            "candidate-2 RGB bytes differ"
          );
          for (const [directory, stems] of [
            ["/tmp/v64-candidate5", [
              "v64-p256-hyperreal-candidate-5a",
              "v64-p256-hyperreal-candidate-5b"
            ]],
            ["/tmp/v64-candidate6", [
              "v64-p256-hyperreal-candidate-6a",
              "v64-p256-hyperreal-candidate-6b",
              "v64-p256-hyperreal-candidate-6c"
            ]]
          ]) {
            for (const stem of stems) {
              const tracked = JSON.parse(readFileSync(`assets/palettes/${stem}.json`, "utf8"));
              const generated = JSON.parse(readFileSync(`${directory}/${stem}.json`, "utf8"));
              assert.deepStrictEqual(generated, tracked, `${stem}.json differs semantically`);
              const hash = createHash("sha256")
                .update(readFileSync(`${directory}/${stem}.rgb`))
                .digest("hex");
              assert.equal(hash, tracked.sha256, `${stem}.rgb hash differs`);
            }
          }
          NODE

  candidate-6:
    needs: [classify, conformance]
    if: ${{ needs.classify.outputs.candidate6_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Run constrained Candidate-6 finalist gate
        run: |
          set -euo pipefail
          mkdir -p bench/results/human-tranche-5
          {
            node --version
            npm --version
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            uname -a
          } > bench/results/human-tranche-5/toolchain.txt
          npm run --silent corpus:missing-classes > bench/results/human-tranche-5/corpus.log
          npm run --silent preview:human5 > bench/results/human-tranche-5/previews.log
          npm run --silent review:human5 > bench/results/human-tranche-5/review.log
          npm run --silent bench:human5 > bench/results/human-tranche-5/benchmark.json
          node -e 'JSON.parse(require("node:fs").readFileSync("bench/results/human-tranche-5/benchmark.json", "utf8"))'
          find bench/results/human-tranche-5 bench/previews/human-tranche-5 bench/reviews/human-tranche-5 \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > bench/results/human-tranche-5/SHA256SUMS
      - name: Upload Candidate-6 blind review and benchmark
        if: ${{ always() && hashFiles('bench/results/human-tranche-5/benchmark.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: human-tranche-5-blind
          if-no-files-found: error
          retention-days: 30
          path: |
            bench/corpus/human-raster-tranche-5-manifest.json
            bench/results/human-tranche-5
            bench/previews/human-tranche-5
            bench/reviews/human-tranche-5
            !bench/reviews/human-tranche-5/key.json
      - name: Upload Candidate-6 concealed review key
        if: ${{ always() && hashFiles('bench/reviews/human-tranche-5/key.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: human-tranche-5-key
          if-no-files-found: error
          retention-days: 30
          path: bench/reviews/human-tranche-5/key.json

  subtitle-mask-3:
    needs: [classify, conformance]
    if: ${{ needs.classify.outputs.sm3_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Run focused SM2-versus-SM3 lecture gate
        run: npm run --silent bench:subtitle-mask3
      - name: Upload SM3 blind review and metrics
        if: ${{ always() && hashFiles('bench/results/subtitle-mask-tranche-3/summary.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-mask-tranche-3-blind
          if-no-files-found: error
          retention-days: 30
          path: |
            bench/results/subtitle-mask-tranche-3
            !bench/results/subtitle-mask-tranche-3/key.json
      - name: Upload SM3 concealed key
        if: ${{ always() && hashFiles('bench/results/subtitle-mask-tranche-3/key.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-mask-tranche-3-key
          if-no-files-found: error
          retention-days: 30
          path: bench/results/subtitle-mask-tranche-3/key.json
