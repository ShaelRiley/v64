name: V64 conformance and benchmarks

on:
  pull_request:
    paths-ignore:
      - "bench/results/**"
      - "bench/reviews/**"
      - "bench/HUMAN_RASTER_TRANCHE_2.md"
      - "IMPLEMENTATION_LEDGER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Run tests
        run: npm test

      - name: Run human raster tranche 2 when present
        if: ${{ hashFiles('bench/corpus/human-raster-tranche-2-manifest.json') != '' }}
        run: |
          set -euo pipefail
          mkdir -p bench/results/human-tranche-2 /tmp/v64-palettes
          {
            node --version
            npm --version
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            uname -a
          } > bench/results/human-tranche-2/toolchain.txt
          node tools/hyperreal-palette-generator.mjs /tmp/v64-palettes \
            > bench/results/human-tranche-2/palette.log
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const stems = [
            "v64-p256-hyperreal-candidate-2",
            "v64-p256-hyperreal-candidate-3"
          ];
          for (const stem of stems) {
            const tracked = JSON.parse(readFileSync(`assets/palettes/${stem}.json`, "utf8"));
            const generated = JSON.parse(readFileSync(`/tmp/v64-palettes/${stem}.json`, "utf8"));
            assert.deepStrictEqual(generated, tracked, `${stem}.json differs semantically`);
          }
          assert.deepStrictEqual(
            readFileSync("/tmp/v64-palettes/v64-p256-hyperreal-candidate-2.rgb"),
            readFileSync("assets/palettes/v64-p256-hyperreal-candidate-2.rgb"),
            "candidate-2 RGB bytes differ"
          );
          NODE
          npm run corpus:missing-classes > bench/results/human-tranche-2/corpus.log
          npm run preview:human2 > bench/results/human-tranche-2/previews.log
          npm run review:human2 > bench/results/human-tranche-2/review.log
          npm run --silent bench:human2 > bench/results/human-tranche-2/benchmark.json
          node -e 'JSON.parse(require("node:fs").readFileSync("bench/results/human-tranche-2/benchmark.json", "utf8"))'
          find bench/results/human-tranche-2 bench/previews/human-tranche-2 bench/reviews/human-tranche-2 \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > bench/results/human-tranche-2/SHA256SUMS

      - name: Upload blind review and benchmark
        if: ${{ always() && hashFiles('bench/results/human-tranche-2/benchmark.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: human-tranche-2-blind
          if-no-files-found: error
          retention-days: 30
          path: |
            bench/results/human-tranche-2
            bench/previews/human-tranche-2
            bench/reviews/human-tranche-2
            !bench/reviews/human-tranche-2/key.json

      - name: Upload concealed review key
        if: ${{ always() && hashFiles('bench/reviews/human-tranche-2/key.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: human-tranche-2-key
          if-no-files-found: error
          retention-days: 30
          path: bench/reviews/human-tranche-2/key.json
