name: V64 conformance and visual gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}

    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Classify latest commit
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only HEAD^ HEAD)"
          printf '%s\n' "$files"
          code_changed=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ ! "$path" =~ ^bench/results/ &&
                  ! "$path" =~ ^bench/reviews/ &&
                  ! "$path" =~ ^bench/HUMAN_RASTER_TRANCHE_[0-9]+\.md$ &&
                  "$path" != "IMPLEMENTATION_LEDGER.md" &&
                  "$path" != "spec/V64-design.md" ]]; then
              code_changed=true
              break
            fi
          done <<< "$files"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

  conformance:
    needs: classify
    if: ${{ needs.classify.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Run tests
        run: npm test

      - name: Verify deterministic Hyper Real assets
        run: |
          set -euo pipefail
          rm -rf /tmp/v64-palettes
          node tools/hyperreal-palette-generator.mjs /tmp/v64-palettes > /tmp/v64-palette-build.json
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const stems = [
            "v64-p256-hyperreal-candidate-2",
            "v64-p256-hyperreal-candidate-3",
            "v64-p256-hyperreal-candidate-4"
          ];
          for (const stem of stems) {
            const tracked = JSON.parse(readFileSync(`assets/palettes/${stem}.json`, "utf8"));
            const generated = JSON.parse(readFileSync(`/tmp/v64-palettes/${stem}.json`, "utf8"));
            assert.deepStrictEqual(generated, tracked, `${stem}.json differs semantically`);
          }
          assert.deepStrictEqual(
            readFileSync("/tmp/v64-palettes/v64-p256-hyperreal-candidate-2.rgb"),
            readFileSync("assets/palettes/v64-p256-hyperreal-candidate-2.rgb"),
            "candidate-2 RGB bytes differ"
          );
          NODE

  candidate-4:
    needs: [classify, conformance]
    if: ${{ needs.classify.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Run matched Candidate-1 and Candidate-4 gate
        run: |
          set -euo pipefail
          mkdir -p bench/results/human-tranche-3
          {
            node --version
            npm --version
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            uname -a
          } > bench/results/human-tranche-3/toolchain.txt
          npm run --silent corpus:missing-classes > bench/results/human-tranche-3/corpus.log
          npm run --silent preview:human3 > bench/results/human-tranche-3/previews.log
          npm run --silent review:human3 > bench/results/human-tranche-3/review.log
          npm run --silent bench:human3 > bench/results/human-tranche-3/benchmark.json
          node -e 'JSON.parse(require("node:fs").readFileSync("bench/results/human-tranche-3/benchmark.json", "utf8"))'
          find bench/results/human-tranche-3 bench/previews/human-tranche-3 bench/reviews/human-tranche-3 \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > bench/results/human-tranche-3/SHA256SUMS

      - name: Upload Candidate-4 blind review and benchmark
        if: ${{ always() && hashFiles('bench/results/human-tranche-3/benchmark.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: human-tranche-3-blind
          if-no-files-found: error
          retention-days: 30
          path: |
            bench/corpus/human-raster-tranche-3-manifest.json
            bench/results/human-tranche-3
            bench/previews/human-tranche-3
            bench/reviews/human-tranche-3
            !bench/reviews/human-tranche-3/key.json

      - name: Upload Candidate-4 concealed review key
        if: ${{ always() && hashFiles('bench/reviews/human-tranche-3/key.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: human-tranche-3-key
          if-no-files-found: error
          retention-days: 30
          path: bench/reviews/human-tranche-3/key.json

  subtitle-mask:
    needs: [classify, conformance]
    if: ${{ needs.classify.outputs.code_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Run subtitle-mask preview and byte-cost experiment
        run: npm run --silent bench:subtitle-mask

      - name: Upload subtitle-mask blind review and metrics
        if: ${{ always() && hashFiles('bench/results/subtitle-mask-tranche-1/summary.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-mask-tranche-1-blind
          if-no-files-found: error
          retention-days: 30
          path: |
            bench/results/subtitle-mask-tranche-1
            !bench/results/subtitle-mask-tranche-1/key.json

      - name: Upload subtitle-mask concealed key
        if: ${{ always() && hashFiles('bench/results/subtitle-mask-tranche-1/key.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-mask-tranche-1-key
          if-no-files-found: error
          retention-days: 30
          path: bench/results/subtitle-mask-tranche-1/key.json
