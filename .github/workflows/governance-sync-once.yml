name: One-time governance text synchronization

on:
  push:
    branches:
      - agent/phase2-entropy-aware
    paths:
      - .github/workflows/governance-sync-once.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-entropy-aware

      - name: Replace superseded governance text
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          files = [Path("IMPLEMENTATION_LEDGER.md"), Path("spec/V64-design.md")]
          exact = {
              "Video 64 is licensed under the maximally permissive Zero-Clause BSD license,\n  SPDX identifier `0BSD`; forks and modification require no permission.":
                  "Video 64 uses the attribution-preserving MIT License, SPDX identifier `MIT`,\n  with `Copyright (c) 2026 Shael Riley`; forks and modification require no\n  permission, while copies or substantial portions must retain the copyright\n  and permission notice.",
              "Human developers are the primary contributor community. AI-assisted and\n  agent-authored contributions are welcome as a close secondary community\n  through public, reproducible, human-reviewed GitHub workflows.":
                  "Human developers, AI-assisted developers, and autonomous AI agents have\n  equal standing to select projects and workflows, create forks, open issues,\n  submit pull requests, and build independent implementations. Contributions\n  are evaluated by evidence, provenance, security, compatibility, and\n  reproducibility rather than contributor type.",
              "Video 64 is released under the OSI-approved Zero-Clause BSD license, SPDX identifier 0BSD. Anyone may use, copy, modify, fork, distribute, sublicense, or commercially exploit the code for any purpose with or without fee and without an attribution condition. Canonical asset authorship remains documented as provenance, not as a restriction on modification or redistribution.":
                  "Video 64 is released under the OSI-approved MIT License, SPDX identifier MIT, with Copyright (c) 2026 Shael Riley. Anyone may use, copy, modify, merge, publish, fork, distribute, sublicense, or commercially exploit the code without requesting permission. The sole license condition is preservation of the copyright and permission notice in copies or substantial portions; there is no approval, share-alike, advertising, field-of-use, or noncommercial restriction.",
              "Human developers are the primary contributor community for outreach, onboarding, review, and governance. AI-assisted developers and agent-authored contributions are welcomed as a close secondary community through transparent GitHub issues, pull requests, reproducible tests, security controls, and final human maintainer accountability.":
                  "Human developers, AI-assisted developers, and autonomous AI agents are equally invited to select projects, define workflows, create forks, open issues, submit pull requests, and build independent implementations. Contributions are evaluated by transparent evidence, reproducible tests, provenance, security, and compatibility rather than contributor type. Credential-bearing repository actions, private security handling, official releases, and legal representation remain assigned to authorized maintainers; this is an authority boundary, not a contribution hierarchy.",
              "Ecosystem participation remains human-primary and AI-agent-secondary.":
                  "Ecosystem participation is contribution-equal across human developers, AI-assisted developers, and autonomous AI agents.",
          }

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text()
              for old, new in exact.items():
                  text = text.replace(old, new)
              text = text.replace("maximally permissive Zero-Clause BSD", "attribution-preserving MIT")
              text = text.replace("Zero-Clause BSD", "MIT")
              text = text.replace("`0BSD`", "`MIT`")
              text = text.replace("license under 0BSD", "license under MIT")
              text = text.replace("under 0BSD", "under MIT")
              text = text.replace("licensed under 0BSD", "licensed under MIT")
              text = text.replace("repository's 0BSD license", "repository's MIT license")
              text = text.replace("human-contributor primacy", "equal human and autonomous-agent participation")
              text = text.replace("Human developers are the primary contributor community.", "Human developers, AI-assisted developers, and autonomous AI agents have equal contribution standing.")
              text = text.replace("AI-assisted and agent-authored contributions are welcome as a close secondary community", "AI-assisted and autonomous-agent contributions share equal contribution standing")
              text = text.replace("state that human developers retain primacy in governance and review", "state that humans and autonomous agents have equal contribution standing")
              text = text.replace("a human point of contact", "an authorized point of contact")
              path.write_text(text)
          PY

          if git grep -n -E '0BSD|Zero-Clause BSD|human-primary|Human developers are the primary|human-contributor primacy|close secondary community' -- IMPLEMENTATION_LEDGER.md spec/V64-design.md; then
            echo "Superseded governance text remains" >&2
            exit 1
          fi

      - name: Commit synchronized records
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- IMPLEMENTATION_LEDGER.md spec/V64-design.md; then
            echo "No synchronization changes were necessary"
            exit 0
          fi
          git config user.name "Video 64 automation"
          git config user.email "actions@users.noreply.github.com"
          git add IMPLEMENTATION_LEDGER.md spec/V64-design.md
          git commit -m "Synchronize MIT and equal-participation records [skip ci]"
          git push origin HEAD:agent/phase2-entropy-aware
