name: V64 human raster 32-primary gate

on:
  pull_request:
    paths:
      - ".github/workflows/human-rd-glyph.yml"
      - "assets/palettes/**"
      - "bench/corpus/**"
      - "package.json"
      - "prototype/js/**"
      - "tests/**"
      - "tools/benchmark-human-rd-glyph.mjs"
  workflow_dispatch:

jobs:
  human-rd-glyph:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run repository tests
        run: npm test

      - name: Build human raster study
        run: npm run bench:human-rd-glyph

      - name: Verify generated evidence
        shell: bash
        run: |
          set -euo pipefail
          output=bench/generated/human-rd-glyph-study
          expected=$(cat "$output/summary.sha256")
          actual=$(sha256sum "$output/summary.json" | cut -d' ' -f1)
          test "$expected" = "$actual"
          test -s "$output/RESULTS.md"
          test -s "$output/manifest.json"
          find "$output/files" -name '*.v64' -print0 | while IFS= read -r -d '' file; do
            node prototype/js/cli.mjs verify "$file" > /dev/null
          done

      - name: Upload human raster evidence
        uses: actions/upload-artifact@v4
        with:
          name: human-rd-glyph-study
          path: bench/generated/human-rd-glyph-study
          if-no-files-found: error
          retention-days: 30
