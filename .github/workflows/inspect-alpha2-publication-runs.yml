name: Inspect alpha.2 publication runs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-alpha2-publication-runs.yml"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report recent alpha.2 runs
        run: |
          set -euo pipefail
          publication="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-alpha2-and-clean-branches.yml/runs?per_page=5" \
            --jq '.workflow_runs[] | "- release run `\(.id)`: status `\(.status)`, conclusion `\(.conclusion // "pending")`, head `\(.head_sha)`"')"
          cleanup="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tag-alpha2-and-clean-branches.yml/runs?per_page=5" \
            --jq '.workflow_runs[] | "- tag/cleanup run `\(.id)`: status `\(.status)`, conclusion `\(.conclusion // "pending")`, head `\(.head_sha)`"')"
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Recent alpha.2 publication and cleanup runs:\n\n$publication\n$cleanup"
