name: Inspect alpha.3 build status

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-alpha3-build.yml"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report current alpha.3 build runs
        run: |
          set -euo pipefail
          sleep 10
          report="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-alpha3-drop-crash-fix.yml/runs?per_page=5" \
            --jq '.workflow_runs[] | "- run `\(.id)`: status `\(.status)`, conclusion `\(.conclusion // "pending")`, head `\(.head_sha)`"')"
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Alpha.3 build state:\n\n$report"
