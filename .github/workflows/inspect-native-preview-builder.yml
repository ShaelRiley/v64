name: Inspect native preview builder

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-native-preview-builder.yml"

permissions:
  actions: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report latest builder runs
        run: |
          set -euo pipefail
          sleep 15
          report="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-native-preview-estimator-main.yml/runs?per_page=5" \
            --jq '.workflow_runs[] | "- run `\(.id)`: status `\(.status)`, conclusion `\(.conclusion // "pending")`, head `\(.head_sha)`"')"
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Native preview builder state:\n\n$report"
