name: Inspect generated PPM parser workflow

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-native-preview-v2.yml"

permissions:
  actions: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report parser-inspection runs
        run: |
          set -euo pipefail
          sleep 15
          report="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/inspect-native-preview-ppm-source.yml/runs?per_page=5" \
            --jq '.workflow_runs[] | "- run `\(.id)`: status `\(.status)`, conclusion `\(.conclusion // "pending")`, head `\(.head_sha)`"')"
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Generated PPM parser workflow state:\n\n$report"