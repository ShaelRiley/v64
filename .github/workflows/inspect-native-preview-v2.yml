# inspect latest exact-block v4 rerun
name: Inspect native preview v4 builder

on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-native-preview-v2.yml"]

permissions:
  actions: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -euo pipefail
          report="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-native-preview-estimator-v4.yml/runs?per_page=5" --jq '.workflow_runs[] | "- run `\(.id)`: status `\(.status)`, conclusion `\(.conclusion // "pending")`, head `\(.head_sha)`"')"
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Native preview v4 latest state:\n\n$report"
