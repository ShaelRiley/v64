name: Inspect generated PPM parser text

on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-native-preview-v2.yml"]

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-preview-estimator
      - run: |
          set -euo pipefail
          base64 -d .github/preview-builder/main.rs.gz.b64 | gzip -d > /tmp/main.rs
          grep -n -C 18 -E 'PPM|ppm_token|separator|maximum value|cursor \+=' /tmp/main.rs > /tmp/parser.txt || true
          body="$(tail -n 220 /tmp/parser.txt)"
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Generated native PPM parser text:\n\n\`\`\`rust\n$body\n\`\`\`"
