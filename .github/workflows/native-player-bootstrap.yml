name: Temporary native player bootstrap

on:
  push:
    branches:
      - agent/native-player
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes libsdl2-dev
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup component add rustfmt --toolchain 1.85.0
          rustup default 1.85.0
          cargo check --package v64-player
          cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: native-player-bootstrap
          if-no-files-found: error
          retention-days: 1
          path: |
            Cargo.lock
            crates/v64-core/src/extensions.rs
            crates/v64-player/src/lib.rs
            crates/v64-player/src/main.rs
