name: V64 native player gate

on:
  pull_request:
    paths:
      - ".github/workflows/native-player.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/glyphs/video64-v1.bin"
      - "assets/palettes/v64-p256-1.**"
      - "bench/generated/am1/**"
      - "bench/generated/subt/**"
      - "bench/results/native-player/**"
      - "crates/v64-core/**"
      - "apps/v64-player/**"
      - "tools/build-am1-fixtures.mjs"
      - "tools/build-subt-fixture.mjs"
      - "docs/NATIVE_PLAYER.md"
      - "docs/PLAYBACK_PROFILE.md"
      - "docs/CURRENT_STATUS.md"
      - "IMPLEMENTATION_LEDGER.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v64-native-player-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-player:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out immutable workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install native player dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg libopus-dev libsdl2-dev xvfb

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup component add rustfmt --toolchain 1.85.0
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Check formatting and normative palette identity
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            crates/v64-core/src/extensions.rs \
            apps/v64-player/src/lib.rs \
            apps/v64-player/src/main.rs
          test "$(wc -c < assets/palettes/v64-p256-1.rgb)" = 768
          echo "c03d23141eb33b80d79d1a7f3167eeb18ccf1f4f0c0f81572f269abd51317105  assets/palettes/v64-p256-1.rgb" \
            | sha256sum --check

      - name: Run JavaScript and Rust regression suites
        shell: bash
        run: |
          set -euo pipefail
          npm test
          cargo test --locked --workspace --all-targets --features v64-player/native-ui
          cargo test --locked --workspace --all-targets --release \
            --features v64-player/native-ui

      - name: Build deterministic subtitle and audio fixtures
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent subt:fixtures
          npm run --silent audio:fixtures

      - name: Build native release player
        run: cargo build --locked --release --package v64-player --features native-ui

      - name: Require deterministic profile-v2 playback evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/native-player

          for fixture in procedural subt am1; do
            case "$fixture" in
              procedural) input="tests/golden/procedural.v64" ;;
              subt) input="bench/generated/subt/subt-container.v64" ;;
              am1) input="bench/generated/am1/am1-container.v64" ;;
            esac
            target/release/v64-player \
              --preferences target/native-player/default.conf \
              --headless-report "target/native-player/${fixture}-a.json" \
              "$input"
            target/release/v64-player \
              --preferences target/native-player/default.conf \
              --headless-report "target/native-player/${fixture}-b.json" \
              "$input"
            cmp "target/native-player/${fixture}-a.json" \
              "target/native-player/${fixture}-b.json"
          done

          target/release/v64-player \
            --preferences target/native-player/default.conf \
            --dump-audio-pcm target/native-player/am1-native.pcm \
            --headless-report target/native-player/am1-pcm-report.json \
            bench/generated/am1/am1-container.v64
          cmp target/native-player/am1-native.pcm bench/generated/am1/am1-decoded.pcm

          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const load = (name) => JSON.parse(
            readFileSync(`target/native-player/${name}-a.json`)
          );
          const procedural = load("procedural");
          const subt = load("subt");
          const am1 = load("am1");
          const reports = [procedural, subt, am1];

          for (const report of reports) {
            assert.equal(report.format, "V64-NATIVE-PLAYER-2");
            assert.equal(report.playerProfileVersion, 2);
            assert.equal(report.bounded.maxAudioPcmBytes, 268435456);
            assert.equal(report.scanlines.defaultEnabled, true);
            assert.equal(report.scanlines.menuPath, "View/CRT Scanlines");
            assert.equal(report.scanlines.keyboardToggle, "C");
            assert.notEqual(
              report.scanlines.unfilteredFnv1a64,
              report.scanlines.filteredFnv1a64
            );
            assert.equal(report.controls.eof, true);
            assert.equal(
              report.controls.repeatedSeekHashes[0],
              report.controls.repeatedSeekHashes[4]
            );
            assert.equal(
              report.controls.repeatedSeekHashes[1],
              report.controls.repeatedSeekHashes[3]
            );
            assert.equal(
              report.controls.eofRecoveryHash,
              report.controls.repeatedSeekHashes[0]
            );
            assert.equal(report.extensions.validatedBeforePlayback, true);
          }

          assert.equal(procedural.subtitlePresentation.composited, false);
          assert.equal(procedural.audioPresentation.decoded, false);

          assert.equal(subt.extensions.subtitleChunks, 2);
          assert.equal(subt.extensions.subtitleFrames, 5);
          assert.equal(subt.extensions.subtitleEntries, 10);
          assert.equal(subt.subtitlePresentation.composited, true);
          assert.equal(subt.audioPresentation.decoded, false);
          assert.equal(new Set(subt.subtitlePresentation.sampleFnv1a64).size > 1, true);

          assert.equal(am1.extensions.audioRuns, 2);
          assert.equal(am1.extensions.silenceRuns, 2);
          assert.equal(am1.extensions.audioPackets, 54);
          assert.equal(am1.audioPresentation.decoded, true);
          assert.equal(am1.audioPresentation.sampleRate, 48000);
          assert.equal(am1.audioPresentation.channels, 1);
          assert.equal(am1.audioPresentation.samples, 96000);
          assert.equal(am1.audioPresentation.bytes, 192000);
          assert.match(am1.audioPresentation.pcmFnv1a64, /^[0-9a-f]{16}$/);
          NODE

      - name: Run real native video and audio loop under Xvfb
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          timeout 20s xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            target/release/v64-player \
              --preferences target/native-player/window.conf \
              --smoke-presents 3 \
              bench/generated/am1/am1-container.v64

      - name: Hash native player evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            assets/palettes/v64-p256-1.rgb \
            bench/generated/subt/subt-container.v64 \
            bench/generated/am1/am1-container.v64 \
            bench/generated/am1/am1-decoded.pcm \
            target/native-player/procedural-a.json \
            target/native-player/subt-a.json \
            target/native-player/am1-a.json \
            target/native-player/am1-native.pcm \
            target/release/v64-player \
            | tee target/native-player/SHA256SUMS

      - name: Upload native player evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v64-native-player-evidence
          if-no-files-found: error
          retention-days: 30
          path: |
            Cargo.lock
            target/native-player
            target/release/v64-player
            bench/generated/subt
            bench/generated/am1
            bench/results/native-player
            docs/NATIVE_PLAYER.md
