name: Patch packaged Node runtime discovery

on:
  push:
    branches: [fix/bundle-node-runtime]
    paths: [".github/workflows/patch-bundled-node-runtime.yml"]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bundle-node-runtime
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy

      - name: Install native and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsdl2-dev xvfb

      - name: Patch runtime discovery and diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/video64-drop-native/src/main.rs')
          text = path.read_text()

          old = '''    let core = CoreConfig {
        node: env::var_os("VIDEO64_DROP_NODE").unwrap_or_else(|| OsString::from("node")),
        cli: options.core_cli.clone(),
    };'''
          new = '''    let core = CoreConfig {
        node: env::var_os("VIDEO64_DROP_NODE").unwrap_or_else(default_node_path),
        cli: options.core_cli.clone(),
    };'''
          if old not in text:
              raise SystemExit('CoreConfig construction contract changed')
          text = text.replace(old, new, 1)

          old = '''fn default_core_cli_path() -> PathBuf {
    if let Ok(executable) = env::current_exe() {
        if let Some(candidate) = core_cli_candidates(&executable)
            .into_iter()
            .find(|candidate| candidate.is_file())
        {
            return candidate;
        }
    }
    PathBuf::from(env!("CARGO_MANIFEST_DIR")).join("../video64-drop/cli.mjs")
}

fn core_output(core: &CoreConfig, arguments: &[OsString]) -> Result<std::process::Output, String> {
    Command::new(&core.node)
        .arg(&core.cli)
        .args(arguments)
        .output()
        .map_err(|error| format!("Unable to start Video64 Drop core: {error}"))
}'''
          new = '''fn default_core_cli_path() -> PathBuf {
    if let Ok(executable) = env::current_exe() {
        if let Some(candidate) = core_cli_candidates(&executable)
            .into_iter()
            .find(|candidate| candidate.is_file())
        {
            return candidate;
        }
    }
    PathBuf::from(env!("CARGO_MANIFEST_DIR")).join("../video64-drop/cli.mjs")
}

fn node_candidates(executable: &Path) -> Vec<PathBuf> {
    let Some(directory) = executable.parent() else {
        return Vec::new();
    };
    vec![
        directory.join("runtime/node/bin/node"),
        directory.join("node/bin/node"),
        directory.join("node"),
    ]
}

fn default_node_path() -> OsString {
    if let Ok(executable) = env::current_exe() {
        if let Some(candidate) = node_candidates(&executable)
            .into_iter()
            .find(|candidate| candidate.is_file())
        {
            return candidate.into_os_string();
        }
    }
    OsString::from("node")
}

fn core_output(core: &CoreConfig, arguments: &[OsString]) -> Result<std::process::Output, String> {
    Command::new(&core.node)
        .arg(&core.cli)
        .args(arguments)
        .output()
        .map_err(|error| {
            if error.kind() == std::io::ErrorKind::NotFound {
                format!(
                    "Unable to start Video64 Drop core: Node.js runtime not found at {}. Re-extract the complete Video64 Drop release archive.",
                    Path::new(&core.node).display()
                )
            } else {
                format!("Unable to start Video64 Drop core: {error}")
            }
        })
}'''
          if old not in text:
              raise SystemExit('Runtime helper contract changed')
          text = text.replace(old, new, 1)

          old = '''        "coreCli": core.cli,
        "transitionalBoundary": {'''
          new = '''        "coreCli": core.cli,
        "nodeRuntime": core.node,
        "transitionalBoundary": {'''
          if old not in text:
              raise SystemExit('Headless report contract changed')
          text = text.replace(old, new, 1)

          anchor = '''    #[test]
    fn stage_progress_is_monotonic() {'''
          test = '''    #[test]
    fn packaged_runtime_candidates_are_relative_to_the_executable() {
        let executable = Path::new("/opt/video64-drop/video64-drop");
        assert_eq!(
            node_candidates(executable),
            vec![
                PathBuf::from("/opt/video64-drop/runtime/node/bin/node"),
                PathBuf::from("/opt/video64-drop/node/bin/node"),
                PathBuf::from("/opt/video64-drop/node"),
            ]
        );
    }

    #[test]
    fn stage_progress_is_monotonic() {'''
          if anchor not in text:
              raise SystemExit('Test insertion point changed')
          text = text.replace(anchor, test, 1)
          path.write_text(text)
          PY
          rustfmt --edition 2024 apps/video64-drop-native/src/main.rs

      - name: Validate source and bundled-runtime behavior
        run: |
          set -euo pipefail
          npm --prefix apps/video64-drop test
          rustfmt --edition 2024 --check apps/video64-drop-native/src/lib.rs apps/video64-drop-native/src/main.rs
          cargo test --locked -p video64-drop-native --features native-ui
          cargo clippy --locked -p video64-drop-native --all-targets --features native-ui -- -D warnings
          cargo build --locked --release -p video64-drop-native --features native-ui

          mkdir -p evidence/bundle/apps evidence/bundle/runtime evidence/proof
          install -m 0755 target/release/video64-drop evidence/bundle/video64-drop
          cp -R apps/video64-drop evidence/bundle/apps/
          cp -R prototype assets tools package.json evidence/bundle/
          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          cp -a "$NODE_ROOT" evidence/bundle/runtime/node

          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=160x90:rate=12 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 2 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac \
            evidence/source.mp4

          env -u VIDEO64_DROP_NODE PATH=/usr/bin:/bin \
            evidence/bundle/video64-drop \
            --headless-report evidence/report.json \
            evidence/source.mp4

          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('evidence/report.json').read_text())
          runtime = Path(report['nodeRuntime'])
          assert runtime.as_posix().endswith('/runtime/node/bin/node'), runtime
          assert len(report['queue']) == 1
          assert report['queue'][0]['audioPresent'] is True
          PY

      - name: Commit production source only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/video64-drop-native/src/main.rs
          git commit -m "Discover bundled Node.js runtime"
          git push origin HEAD:fix/bundle-node-runtime
