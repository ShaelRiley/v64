name: Patch packaged Node runtime discovery

on:
  push:
    branches:
      - fix/bundle-node-runtime
    paths:
      - .github/workflows/patch-bundled-node-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bundle-node-runtime
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsdl2-dev xvfb

      - name: Apply source patch
        run: |
          python3 tools/patch-bundled-node-runtime.py
          rustfmt --edition 2024 apps/video64-drop-native/src/main.rs

      - name: Validate source
        run: |
          set -euo pipefail
          npm --prefix apps/video64-drop test
          rustfmt --edition 2024 --check apps/video64-drop-native/src/lib.rs apps/video64-drop-native/src/main.rs
          cargo test --locked -p video64-drop-native --features native-ui
          cargo clippy --locked -p video64-drop-native --all-targets --features native-ui -- -D warnings
          cargo build --locked --release -p video64-drop-native --features native-ui

      - name: Validate private runtime discovery
        run: |
          set -euo pipefail
          mkdir -p evidence/bundle/apps evidence/bundle/runtime
          install -m 0755 target/release/video64-drop evidence/bundle/video64-drop
          cp -R apps/video64-drop evidence/bundle/apps/
          cp -R prototype assets tools package.json evidence/bundle/
          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          cp -a "$NODE_ROOT" evidence/bundle/runtime/node
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=160x90:rate=12 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 2 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac evidence/source.mp4
          env -u VIDEO64_DROP_NODE PATH=/usr/bin:/bin evidence/bundle/video64-drop --headless-report evidence/report.json evidence/source.mp4
          python3 -c "import json; from pathlib import Path; r=json.loads(Path('evidence/report.json').read_text()); assert Path(r['nodeRuntime']).as_posix().endswith('/runtime/node/bin/node'); assert len(r['queue']) == 1; assert r['queue'][0]['audioPresent'] is True"

      - name: Commit production source
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/video64-drop-native/src/main.rs
          git commit -m "Discover bundled Node.js runtime"
          git push origin HEAD:fix/bundle-node-runtime
