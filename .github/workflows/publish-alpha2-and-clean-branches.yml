name: Publish current Linux prerelease and clean merged branches

on:
  pull_request:
    paths:
      - ".github/workflows/publish-alpha2-and-clean-branches.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-alpha2-and-clean-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video64-alpha2-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        run: |
          set -euo pipefail
          test -f Cargo.lock
          test -f apps/v64-player/Cargo.toml
          test -f apps/video64-drop-native/Cargo.toml
          test -f apps/video64-drop/cli.mjs
          test -f prototype/js/cli.mjs
          test -f LICENSE

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-alpha.2
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy

      - name: Install Linux and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libopus-dev libsdl2-dev xvfb

      - name: Test and build current Linux applications
        run: |
          set -euo pipefail
          npm --prefix apps/video64-drop test
          cargo test --locked --package v64-player --features native-ui
          cargo test --locked --package video64-drop-native --features native-ui
          cargo build --locked --release --package v64-player --features native-ui
          cargo build --locked --release --package video64-drop-native --features native-ui

      - name: Generate current audiovisual sample, estimate, and preview
        run: |
          set -euo pipefail
          mkdir -p dist/sample-preview
          ffmpeg -y -v error \
            -f lavfi -i testsrc2=size=320x180:rate=24:duration=4 \
            -f lavfi -i sine=frequency=660:sample_rate=48000:duration=4 \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -ac 1 -ar 48000 \
            dist/video64-alpha2-source.mp4
          node apps/video64-drop/cli.mjs estimate \
            dist/video64-alpha2-source.mp4 \
            --columns 40 --palette 16 --glyphs 32 --profile balanced \
            > dist/video64-alpha2-estimate.json
          node apps/video64-drop/cli.mjs preview \
            dist/video64-alpha2-source.mp4 dist/sample-preview \
            --columns 40 --palette 16 --glyphs 32 --profile balanced \
            > dist/video64-alpha2-preview.json
          target/release/video64-drop \
            --core-cli apps/video64-drop/cli.mjs \
            --headless-encode dist/video64-alpha2-source.mp4 \
            dist/video64-alpha2-sample.v64 \
            --headless-report dist/video64-alpha2-encode-report.json
          node prototype/js/cli.mjs verify dist/video64-alpha2-sample.v64 \
            > dist/video64-alpha2-verification.json
          cmp dist/video64-alpha2-preview.json dist/sample-preview/preview.json

      - name: Assemble and smoke-test Linux developer bundles
        run: |
          set -euo pipefail
          mkdir -p release/video64-player-linux-x86_64 \
            release/video64-drop-linux-x86_64/apps \
            release/video64-alpha2-sample

          install -m 0755 target/release/v64-player \
            release/video64-player-linux-x86_64/v64-player
          cp LICENSE README.md docs/NATIVE_PLAYER.md \
            release/video64-player-linux-x86_64/

          install -m 0755 target/release/video64-drop \
            release/video64-drop-linux-x86_64/video64-drop
          cp -R apps/video64-drop \
            release/video64-drop-linux-x86_64/apps/
          cp -R prototype assets tools \
            release/video64-drop-linux-x86_64/
          cp package.json LICENSE README.md \
            release/video64-drop-linux-x86_64/
          cp apps/video64-drop-native/README.md \
            release/video64-drop-linux-x86_64/NATIVE-SHELL-README.md
          cat > release/video64-drop-linux-x86_64/run-video64-drop.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$here/video64-drop" --core-cli "$here/apps/video64-drop/cli.mjs" "$@"
          SH
          chmod 0755 release/video64-drop-linux-x86_64/run-video64-drop.sh
          cat > release/video64-drop-linux-x86_64/RUNTIME-REQUIREMENTS.txt <<'TXT'
          Linux x86_64 developer bundle.
          Requires Node.js 20+, FFmpeg/FFprobe, and SDL2 at runtime.
          AM1 source-audio encoding remains provisional pending blinded listening.
          Use ./run-video64-drop.sh so the shell finds the bundled application core.
          TXT

          release/video64-drop-linux-x86_64/run-video64-drop.sh \
            --headless-report dist/video64-alpha2-bundle-smoke.json \
            dist/video64-alpha2-source.mp4

          cp dist/video64-alpha2-source.mp4 \
            dist/video64-alpha2-sample.v64 \
            dist/video64-alpha2-estimate.json \
            dist/video64-alpha2-preview.json \
            dist/video64-alpha2-encode-report.json \
            dist/video64-alpha2-verification.json \
            dist/video64-alpha2-bundle-smoke.json \
            dist/sample-preview/source.ppm \
            dist/sample-preview/decoded-v64.ppm \
            dist/sample-preview/comparison.ppm \
            release/video64-alpha2-sample/

          tar -C release -czf dist/video64-player-linux-x86_64.tar.gz \
            video64-player-linux-x86_64
          tar -C release -czf dist/video64-drop-linux-x86_64.tar.gz \
            video64-drop-linux-x86_64
          tar -C release -czf dist/video64-alpha2-sample-bundle.tar.gz \
            video64-alpha2-sample

      - name: Record manifest, checksums, and notes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          names = [
            "video64-player-linux-x86_64.tar.gz",
            "video64-drop-linux-x86_64.tar.gz",
            "video64-alpha2-sample-bundle.tar.gz",
            "video64-alpha2-sample.v64",
          ]
          assets = []
          for name in names:
            p = Path("dist") / name
            assets.append({"name": name, "bytes": p.stat().st_size,
                           "sha256": hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest = {
            "format": "VIDEO64-ALPHA2-RELEASE-MANIFEST-1",
            "project": "Video 64",
            "tag": os.environ["TAG"],
            "commit": os.environ["GITHUB_SHA"],
            "prerelease": True,
            "platform": "Linux x86_64",
            "assets": assets,
            "verification": json.loads(Path("dist/video64-alpha2-verification.json").read_text()),
            "bundleSmoke": json.loads(Path("dist/video64-alpha2-bundle-smoke.json").read_text()),
            "boundaries": {
              "am1BitrateFrozen": False,
              "nativePreviewPresentation": False,
              "bundledNodeRuntime": False,
              "windowsPackage": False,
              "macosPackage": False,
            },
          }
          Path("dist/video64-alpha2-release-manifest.json").write_text(
            json.dumps(manifest, indent=2) + "\n")
          PY
          (cd dist && sha256sum \
            video64-player-linux-x86_64.tar.gz \
            video64-drop-linux-x86_64.tar.gz \
            video64-alpha2-sample-bundle.tar.gz \
            video64-alpha2-sample.v64 \
            video64-alpha2-release-manifest.json > SHA256SUMS.txt)
          cat > dist/RELEASE-NOTES.md <<EOF
          ## Video 64 v0.1.0-alpha.2

          Current Linux developer prerelease built from commit \`${GITHUB_SHA}\`.

          This advances beyond the intentionally silent first playable release with native subtitle and AM1 audio playback, feature-length A/V synchronization evidence, stable Rust API/CLI/C ABI, the Linux Video64 Drop shell, bounded long-form source-audio encoding, sampled size estimation, decoded preview generation, and a deterministic audiovisual sample.

          Assets include the current native player, a smoke-tested Video64 Drop developer bundle, a complete sample/evidence bundle, the directly playable sample, a manifest, and SHA-256 checksums.

          This remains a prerelease. AM1 8 kbps is provisional pending genuine blinded listening. Preview and estimation are not yet presented in the SDL2 window. Video64 Drop still requires system Node.js, FFmpeg/FFprobe, and SDL2. Windows and macOS packages are not included.
          EOF

      - name: Create immutable prerelease
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving it unchanged."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Video 64 v0.1.0-alpha.2 — Current Linux Developer Prerelease" \
              --notes-file dist/RELEASE-NOTES.md --prerelease \
              dist/video64-player-linux-x86_64.tar.gz \
              dist/video64-drop-linux-x86_64.tar.gz \
              dist/video64-alpha2-sample-bundle.tar.gz \
              dist/video64-alpha2-sample.v64 \
              dist/video64-alpha2-release-manifest.json \
              dist/SHA256SUMS.txt
          fi

      - name: Delete merged and superseded remote branches
        run: |
          set -euo pipefail
          branches=(
            agent/feature-length-av-sync
            agent/first-playable-release-record
            agent/grammar-b-shootout
            agent/grammar-b-shootout-v2
            agent/license-hostile-gate-staging
            agent/native-player
            agent/native-subtitle-audio
            agent/normative-encoder-default
            agent/phase2-entropy-aware
            agent/stable-api-c-abi
            agent/video64-drop-am1-source-audio
            agent/video64-drop-core
            agent/video64-drop-native-shell
            agent/video64-drop-preview-estimator
            agent/video64-drop-streaming-am1
            docs/profile-v2-current-status
            agent/publish-alpha2-and-clean-branches
          )
          : > dist/branch-cleanup.txt
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
              printf 'deleted %s\n' "$branch" | tee -a dist/branch-cleanup.txt
            else
              printf 'absent %s\n' "$branch" | tee -a dist/branch-cleanup.txt
            fi
          done
          gh release upload "$TAG" dist/branch-cleanup.txt --clobber

      - name: Upload workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video64-alpha2-publish-evidence
          if-no-files-found: warn
          retention-days: 90
          path: dist/
