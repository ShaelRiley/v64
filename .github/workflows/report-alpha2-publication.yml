name: Report alpha.2 publication result

on:
  workflow_run:
    workflows:
      - Publish current Linux prerelease and clean merged branches
    types:
      - completed

permissions:
  issues: write

jobs:
  report:
    if: github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report exact publication result to contributor issue
        run: |
          set -euo pipefail
          conclusion='${{ github.event.workflow_run.conclusion }}'
          run_id='${{ github.event.workflow_run.id }}'
          run_url='${{ github.event.workflow_run.html_url }}'
          head_sha='${{ github.event.workflow_run.head_sha }}'
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Alpha.2 publication workflow completed.\n\n- conclusion: \`$conclusion\`\n- run: $run_url\n- run ID: \`$run_id\`\n- head: \`$head_sha\`\n\nThe immutable release tag and branch list remain the authoritative completion checks."
