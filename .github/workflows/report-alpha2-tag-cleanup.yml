name: Report alpha.2 tag and cleanup result

on:
  workflow_run:
    workflows:
      - Tag tested alpha.2 and clean stale branches
    types:
      - completed

permissions:
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report exact tag and cleanup result
        run: |
          set -euo pipefail
          conclusion='${{ github.event.workflow_run.conclusion }}'
          run_id='${{ github.event.workflow_run.id }}'
          run_url='${{ github.event.workflow_run.html_url }}'
          head_sha='${{ github.event.workflow_run.head_sha }}'
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Alpha.2 tag and cleanup workflow completed.\n\n- conclusion: \`$conclusion\`\n- run: $run_url\n- run ID: \`$run_id\`\n- head: \`$head_sha\`"
