name: Reset and dispatch corrected alpha.2 publication

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reset-alpha2-publication.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  reset:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel older publication attempts
        id: cancel
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-alpha2-and-clean-branches.yml/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | .id'
          )
          printf '%s\n' "${run_ids[@]:-}" | sed '/^$/d' > /tmp/cancelled-runs.txt
          for run_id in "${run_ids[@]:-}"; do
            [ -n "$run_id" ] || continue
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done
          sleep 15

      - name: Dispatch corrected publication workflow
        run: |
          set -euo pipefail
          gh workflow run publish-alpha2-and-clean-branches.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

      - name: Record reset on contributor issue
        run: |
          set -euo pipefail
          cancelled="$(tr '\n' ' ' < /tmp/cancelled-runs.txt | sed 's/[[:space:]]*$//')"
          [ -n "$cancelled" ] || cancelled="none"
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Corrected alpha.2 publication dispatched after cancelling older active attempts.\n\n- cancelled run IDs: \`$cancelled\`\n- corrected workflow head: \`$GITHUB_SHA\`\n- bundle path correction and packaged-launcher smoke test are included."
