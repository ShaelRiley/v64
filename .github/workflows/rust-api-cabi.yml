name: V64 stable Rust API, CLI, and C ABI gate

on:
  pull_request:
    paths:
      - ".github/workflows/rust-api-cabi.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "include/video64/**"
      - "spec/V64-c-api-v1.md"
      - "spec/v64-c-api-v1.symbols"
      - "tests/capi/**"
      - "tests/golden/procedural.v64"
      - "tools/write-video-golden-stream.mjs"
      - "README.md"
      - "docs/RUST_API.md"
      - "docs/CURRENT_STATUS.md"
      - "IMPLEMENTATION_LEDGER.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v64-rust-api-cabi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-api-cabi:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out immutable workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup component add rustfmt --toolchain 1.85.0
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Check stable API formatting and public headers
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cc -std=c11 -Wall -Wextra -Werror -Iinclude \
            -fsyntax-only tests/capi/v64_capi_smoke.c
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            -fsyntax-only tests/capi/header_cpp_smoke.cpp

      - name: Run JavaScript and Rust regression suites
        shell: bash
        run: |
          set -euo pipefail
          npm test
          cargo test --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets --release

      - name: Build stable release surfaces
        run: cargo build --locked --release --package v64-cli --package v64-capi

      - name: Require exact exported C symbols
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/api-cabi
          nm -D --defined-only target/release/libv64_capi.so \
            | awk '{print $3}' \
            | grep '^v64_' \
            | LC_ALL=C sort \
            > target/api-cabi/exported-symbols.txt
          cmp spec/v64-c-api-v1.symbols target/api-cabi/exported-symbols.txt

      - name: Compile and run real C and C++ callers
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror tests/capi/v64_capi_smoke.c \
            -Iinclude -Ltarget/release \
            -Wl,-rpath,"$PWD/target/release" -lv64_capi \
            -o target/api-cabi/v64-capi-smoke
          c++ -std=c++17 -Wall -Wextra -Werror tests/capi/header_cpp_smoke.cpp \
            -Iinclude -Ltarget/release \
            -Wl,-rpath,"$PWD/target/release" -lv64_capi \
            -o target/api-cabi/v64-capi-cpp-smoke
          target/api-cabi/v64-capi-cpp-smoke
          target/api-cabi/v64-capi-smoke \
            tests/golden/procedural.v64 \
            target/api-cabi/c-state-stream.bin \
            | tee target/api-cabi/c-report.json

      - name: Require JavaScript, Rust CLI, and C byte agreement
        shell: bash
        run: |
          set -euo pipefail
          node tools/write-video-golden-stream.mjs \
            tests/golden/procedural.v64 \
            target/api-cabi/javascript-state-stream.bin
          cargo run --locked --release --package v64-cli -- state-stream \
            tests/golden/procedural.v64 \
            target/api-cabi/rust-state-stream.bin
          cmp target/api-cabi/javascript-state-stream.bin \
            target/api-cabi/rust-state-stream.bin
          cmp target/api-cabi/javascript-state-stream.bin \
            target/api-cabi/c-state-stream.bin

      - name: Require deterministic stable CLI reports
        shell: bash
        run: |
          set -euo pipefail
          target/release/v64 inspect tests/golden/procedural.v64 \
            > target/api-cabi/inspect-a.json
          target/release/v64 inspect tests/golden/procedural.v64 \
            > target/api-cabi/inspect-b.json
          cmp target/api-cabi/inspect-a.json target/api-cabi/inspect-b.json
          target/release/v64 verify tests/golden/procedural.v64 \
            > target/api-cabi/verify-a.json
          target/release/v64 verify tests/golden/procedural.v64 \
            > target/api-cabi/verify-b.json
          cmp target/api-cabi/verify-a.json target/api-cabi/verify-b.json
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const c = JSON.parse(readFileSync("target/api-cabi/c-report.json"));
          const inspect = JSON.parse(readFileSync("target/api-cabi/inspect-a.json"));
          const verify = JSON.parse(readFileSync("target/api-cabi/verify-a.json"));
          assert.equal(c.format, "V64-C-ABI-1");
          assert.equal(c.valid, true);
          assert.equal(c.abiVersion, 1);
          assert.equal(c.decoderApiVersion, 1);
          assert.equal(c.outOfRangeSentinel, 256);
          assert.equal(c.staleHandleRejected, true);
          assert.equal(c.decodedRecords, c.videoRecords);
          assert.equal(inspect.format, "V64-CLI-INSPECT-1");
          assert.equal(verify.format, "V64-CLI-VERIFY-1");
          assert.equal(verify.valid, true);
          assert.equal(verify.videoRecords, c.videoRecords);
          NODE

      - name: Hash stable API evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            target/api-cabi/javascript-state-stream.bin \
            target/api-cabi/rust-state-stream.bin \
            target/api-cabi/c-state-stream.bin \
            target/api-cabi/c-report.json \
            target/api-cabi/inspect-a.json \
            target/api-cabi/verify-a.json \
            target/api-cabi/exported-symbols.txt \
            target/release/libv64_capi.so \
            target/release/v64 \
            | tee target/api-cabi/SHA256SUMS

      - name: Upload stable API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v64-rust-api-cabi-evidence
          if-no-files-found: error
          retention-days: 30
          path: |
            target/api-cabi
            include/video64/v64.h
            docs/RUST_API.md
            spec/V64-c-api-v1.md
            spec/v64-c-api-v1.symbols
