name: V64 Rust core golden gate

on:
  pull_request:
    paths:
      - ".github/workflows/rust-core.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tests/golden/**"
      - "tools/write-video-golden-stream.mjs"
      - "tools/write-grammar-b-fixture.mjs"
      - "tools/decode-grammar-b-fixture.mjs"
      - "tools/implement-resource-rollback-once.py"
      - "tools/resource-rollback-preflight.py"
      - "prototype/js/constants.mjs"
      - "prototype/js/container.mjs"
      - "prototype/js/commands.mjs"
      - "prototype/js/grammar-b.mjs"
      - "prototype/js/grammar-b-direct.mjs"
      - "prototype/js/varint.mjs"
      - "IMPLEMENTATION_LEDGER.md"
  workflow_dispatch:

jobs:
  rust-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup component add rustfmt --toolchain 1.85.0
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Build proposed resource and rollback patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/implement-resource-rollback-once.py
          python3 tools/resource-rollback-preflight.py
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Build and test v64-core
        run: cargo test --locked --workspace --all-targets

      - name: Test optimized release parser and decoders
        run: cargo test --locked --workspace --all-targets --release

      - name: Generate JavaScript Phase-1 decoded-state stream
        run: >-
          node tools/write-video-golden-stream.mjs
          tests/golden/procedural.v64
          target/javascript-phase1-states.bin

      - name: Generate Rust Phase-1 decoded-state stream
        run: >-
          cargo run --locked --release --bin v64-golden-stream --
          tests/golden/procedural.v64
          target/rust-phase1-states.bin

      - name: Generate deterministic Grammar B fixture
        run: >-
          node tools/write-grammar-b-fixture.mjs
          tests/golden/procedural.v64
          target/grammar-b-fixture.bin

      - name: Decode Grammar B fixture in JavaScript
        run: >-
          node tools/decode-grammar-b-fixture.mjs
          target/grammar-b-fixture.bin
          target/javascript-grammar-b-states.bin

      - name: Decode Grammar B fixture in Rust
        run: >-
          cargo run --locked --release --bin v64-grammar-b-golden --
          target/grammar-b-fixture.bin
          target/rust-grammar-b-states.bin

      - name: Require four-way byte-identical decoded states
        shell: bash
        run: |
          set -euo pipefail
          cmp target/javascript-phase1-states.bin target/rust-phase1-states.bin
          cmp target/javascript-phase1-states.bin target/javascript-grammar-b-states.bin
          cmp target/javascript-phase1-states.bin target/rust-grammar-b-states.bin
          sha256sum target/javascript-phase1-states.bin | tee target/video-state-sha256.txt
          sha256sum target/grammar-b-fixture.bin | tee target/grammar-b-fixture-sha256.txt

      - name: Run resource and rollback gates twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/resource-rollback
          cargo run --locked --release --bin v64-resource-gate -- target/resource-rollback/resource-a.json
          cargo run --locked --release --bin v64-resource-gate -- target/resource-rollback/resource-b.json
          cmp target/resource-rollback/resource-a.json target/resource-rollback/resource-b.json
          cargo run --locked --release --bin v64-frame-rollback-gate -- target/resource-rollback/rollback-a.json
          cargo run --locked --release --bin v64-frame-rollback-gate -- target/resource-rollback/rollback-b.json
          cmp target/resource-rollback/rollback-a.json target/resource-rollback/rollback-b.json
          python3 -c 'import json,pathlib; r=json.loads(pathlib.Path("target/resource-rollback/resource-a.json").read_text()); b=json.loads(pathlib.Path("target/resource-rollback/rollback-a.json").read_text()); assert r["format"]=="V64-RUST-RESOURCE-GATE-1" and r["case_count"]==3 and r["exact_boundary_accepted"] is True; assert b["format"]=="V64-RUST-FRAME-ROLLBACK-GATE-1" and b["case_count"]==5 and b["prior_state_immutable"] is True and b["valid_delta_recovery_after_each_failure"] is True'
          sha256sum target/resource-rollback/resource-a.json target/resource-rollback/rollback-a.json > target/resource-rollback/SHA256SUMS

      - name: Package checked implementation patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/resource-patch
          tar -czf target/resource-patch/v64-resource-rollback-patch.tar.gz crates/v64-core/src/lib.rs crates/v64-core/src/frame.rs crates/v64-core/src/bin/v64-golden-stream.rs crates/v64-core/src/bin/v64-resource-gate.rs crates/v64-core/src/bin/v64-frame-rollback-gate.rs .github/workflows/rust-resource-rollback.yml target/resource-rollback
          sha256sum target/resource-patch/v64-resource-rollback-patch.tar.gz > target/resource-patch/PATCH_SHA256

      - name: Upload checked resource patch
        uses: actions/upload-artifact@v4
        with:
          name: v64-resource-rollback-patch
          path: target/resource-patch
          if-no-files-found: error
          retention-days: 30

      - name: Upload cross-language state evidence
        uses: actions/upload-artifact@v4
        with:
          name: v64-rust-javascript-golden
          path: |
            target/javascript-phase1-states.bin
            target/rust-phase1-states.bin
            target/javascript-grammar-b-states.bin
            target/rust-grammar-b-states.bin
            target/grammar-b-fixture.bin
            target/video-state-sha256.txt
            target/grammar-b-fixture-sha256.txt
            IMPLEMENTATION_LEDGER.md
          if-no-files-found: error
          retention-days: 30
