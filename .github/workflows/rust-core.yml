name: V64 Rust core golden gate

on:
  pull_request:
    paths:
      - ".github/workflows/rust-core.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tests/golden/**"
      - "prototype/js/constants.mjs"
      - "prototype/js/container.mjs"
  workflow_dispatch:

jobs:
  rust-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Build and test v64-core
        run: cargo test --locked --workspace --all-targets

      - name: Test optimized release parser
        run: cargo test --locked --workspace --all-targets --release
