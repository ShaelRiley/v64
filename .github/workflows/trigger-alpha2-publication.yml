name: Trigger alpha.2 publication

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-alpha2-publication.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch publication workflow on main
        run: |
          set -euo pipefail
          gh workflow run publish-alpha2-and-clean-branches.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
