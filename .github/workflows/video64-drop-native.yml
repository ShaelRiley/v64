name: Video64 Drop native-shell gate

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/video64-drop/**"
      - "apps/video64-drop-native/**"
      - "prototype/js/**"
      - "tests/video64-drop*.test.mjs"
      - ".github/workflows/video64-drop-native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Install native and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsdl2-dev xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy

      - name: Apply pinned native-shell source normalization
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/video64-drop-native/src/main.rs")
          text = path.read_text()
          replacements = {
              'const ENCODE_BUTTON: Rect = Rect::new(810, 650, 170, 46);': 'fn encode_button() -> Rect {\n    Rect::new(810, 650, 170, 46)\n}',
              'run_windowed(core, options.inputs, options.smoke_presents)': 'run_windowed(&core, options.inputs, options.smoke_presents)',
              'fn run_windowed(\n    core: CoreConfig,': 'fn run_windowed(\n    core: &CoreConfig,',
              'thread::spawn(move || run_encode_worker(core, settings, job, sender));': 'thread::spawn(move || run_encode_worker(&core, &settings, &job, &sender));',
              'fn run_encode_worker(\n    core: CoreConfig,\n    settings: ShellSettings,\n    job: ShellJob,\n    sender: Sender<WorkerMessage>,': 'fn run_encode_worker(\n    core: &CoreConfig,\n    settings: &ShellSettings,\n    job: &ShellJob,\n    sender: &Sender<WorkerMessage>,',
              '    progress: f32,': '    progress_percent: u32,',
              '    let filled = (progress.clamp(0.0, 1.0) * width as f32).round() as u32;': '    let filled = width.saturating_mul(progress_percent.min(100)) / 100;',
              'assert_eq!(values.last().copied(), Some(1.0));': 'assert_eq!(values.last().copied(), Some(100));',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          stage_old = "\n".join([
              "fn stage_progress(stage: Option<&str>) -> f32 {",
              "    match stage {",
              "        Some(\"analysis\") => 0.12,",
              "        Some(\"video_encode\") => 0.48,",
              "        Some(\"audio_encode\") => 0.70,",
              "        Some(\"mux\") => 0.84,",
              "        Some(\"verify\") => 0.94,",
              "        Some(\"complete\") => 1.0,",
              "        _ => 0.03,",
              "    }",
              "}",
          ])
          stage_new = "\n".join([
              "fn stage_progress(stage: Option<&str>) -> u32 {",
              "    match stage {",
              "        Some(\"analysis\") => 12,",
              "        Some(\"video_encode\") => 48,",
              "        Some(\"audio_encode\") => 70,",
              "        Some(\"mux\") => 84,",
              "        Some(\"verify\") => 94,",
              "        Some(\"complete\") => 100,",
              "        _ => 3,",
              "    }",
              "}",
          ])
          text = text.replace(stage_old, stage_new)
          if 'ENCODE_BUTTON' in text and 'const ENCODE_BUTTON' not in text:
              text = text.replace('ENCODE_BUTTON', 'encode_button()')
          text = text.replace('add_inputs(&core,', 'add_inputs(core,')
          text = text.replace('start_next_worker(&core,', 'start_next_worker(core,')
          text = text.replace('handle_click(&core,', 'handle_click(core,')
          text = re.sub(r'state\.notice = "([^"]+)"\.to_owned\(\);', r'"\1".clone_into(&mut state.notice);', text)
          text = re.sub(r'state\.notice = "([^"]+)"\.to_owned\(\),', r'"\1".clone_into(&mut state.notice),', text)
          path.write_text(text)
          PY
          rustfmt --edition 2024 \
            apps/video64-drop-native/src/lib.rs \
            apps/video64-drop-native/src/main.rs
          if ! git diff --quiet -- apps/video64-drop-native/src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/video64-drop-native/src
            git commit -m "Harden native Video64 Drop shell lint compliance"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Test application core and queue planning
        run: npm --prefix apps/video64-drop test

      - name: Check native-shell Rust formatting
        run: |
          rustfmt --edition 2024 --check \
            apps/video64-drop-native/src/lib.rs \
            apps/video64-drop-native/src/main.rs

      - name: Test native shell
        run: cargo test --locked -p video64-drop-native --features native-ui

      - name: Lint native shell
        run: cargo clippy --locked -p video64-drop-native --all-targets --features native-ui -- -D warnings

      - name: Build release shell
        run: cargo build --locked --release -p video64-drop-native --features native-ui

      - name: Generate real audiovisual source
        run: |
          mkdir -p evidence
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=320x180:rate=24 \
            -f lavfi -i sine=frequency=660:sample_rate=48000 \
            -t 1 -shortest \
            -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -ac 1 -ar 48000 \
            evidence/source.mp4

      - name: Prove deterministic shell planning and source disclosure
        run: |
          ./target/release/video64-drop \
            --core-cli apps/video64-drop/cli.mjs \
            --headless-report evidence/shell-report-a.json \
            evidence/source.mp4
          ./target/release/video64-drop \
            --core-cli apps/video64-drop/cli.mjs \
            --headless-report evidence/shell-report-b.json \
            evidence/source.mp4
          cmp evidence/shell-report-a.json evidence/shell-report-b.json

      - name: Encode and verify through the native shell bridge
        run: |
          ./target/release/video64-drop \
            --core-cli apps/video64-drop/cli.mjs \
            --headless-encode evidence/source.mp4 evidence/output.v64 \
            --headless-report evidence/encode-report.json
          node prototype/js/cli.mjs verify evidence/output.v64 > evidence/verify.json

      - name: Exercise the real SDL2 window under Xvfb
        run: |
          xvfb-run -a env SDL_AUDIODRIVER=dummy \
            ./target/release/video64-drop \
            --core-cli apps/video64-drop/cli.mjs \
            --smoke-presents 4 \
            evidence/source.mp4

      - name: Assert native-shell evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          shell = json.loads(Path("evidence/shell-report-a.json").read_text())
          assert shell["format"] == "VIDEO64-DROP-NATIVE-SHELL-1"
          assert shell["capabilities"]["desktopShell"] is True
          assert shell["capabilities"]["dragAndDrop"] is True
          assert shell["settings"] == {
              "fps": "24",
              "columns": 80,
              "palette": 32,
              "glyphs": 32,
              "profile": "balanced",
          }
          assert len(shell["queue"]) == 1
          queued = shell["queue"][0]
          assert queued["grid"] == {"columns": 80, "rows": 23}
          assert queued["audioPresent"] is True
          assert any("audio" in warning.lower() for warning in queued["warnings"])

          encoded = json.loads(Path("evidence/encode-report.json").read_text())
          assert encoded["format"] == "VIDEO64-DROP-NATIVE-ENCODE-1"
          assert encoded["coreExitSuccess"] is True
          final = encoded["finalJob"]
          assert final["status"] == "completed"
          assert final["stages"]["audio_encode"]["state"] == "skipped"
          assert final["result"]["verification"]["valid"] is True
          assert final["result"]["verification"]["outputBytes"] > 0
          assert any(event.get("stage") == "verify" for event in encoded["events"])
          assert Path("evidence/output.v64").stat().st_size == final["result"]["verification"]["outputBytes"]

          verified = json.loads(Path("evidence/verify.json").read_text())
          assert verified["valid"] is True
          PY

      - name: Record checksums
        run: |
          sha256sum \
            target/release/video64-drop \
            evidence/source.mp4 \
            evidence/output.v64 \
            evidence/shell-report-a.json \
            evidence/encode-report.json \
            evidence/verify.json \
            > evidence/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: video64-drop-native-shell-evidence
          path: |
            target/release/video64-drop
            evidence/
          if-no-files-found: error
