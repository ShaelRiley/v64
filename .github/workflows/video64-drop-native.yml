name: Video64 Drop native-shell gate

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/video64-drop/**"
      - "apps/video64-drop-native/**"
      - "prototype/js/**"
      - "tests/video64-drop*.test.mjs"
      - ".github/workflows/video64-drop-native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Install native and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsdl2-dev xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy

      - name: Apply pinned native-shell source normalization
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/video64-drop-native/src/main.rs")
          text = path.read_text()
          old = 'const ENCODE_BUTTON: Rect = Rect::new(810, 650, 170, 46);'
          new = 'fn encode_button() -> Rect {\n    Rect::new(810, 650, 170, 46)\n}'
          if old in text:
              text = text.replace(old, new)
              text = text.replace('ENCODE_BUTTON', 'encode_button()')
              path.write_text(text)
          PY
          rustfmt --edition 2024 \
            apps/video64-drop-native/src/lib.rs \
            apps/video64-drop-native/src/main.rs
          if ! git diff --quiet -- apps/video64-drop-native/src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/video64-drop-native/src
            git commit -m "Fix native Video64 Drop shell compilation"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Test application core and queue planning
        run: npm --prefix apps/video64-drop test

      - name: Check native-shell Rust formatting
        run: |
          rustfmt --edition 2024 --check \
            apps/video64-drop-native/src/lib.rs \
            apps/video64-drop-native/src/main.rs

      - name: Test native shell
        run: cargo test --locked -p video64-drop-native --features native-ui

      - name: Lint native shell
        run: cargo clippy --locked -p video64-drop-native --all-targets --features native-ui -- -D warnings

      - name: Build release shell
        run: cargo build --locked --release -p video64-drop-native --features native-ui

      - name: Generate real audiovisual source
        run: |
          mkdir -p evidence
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=320x180:rate=24 \
            -f lavfi -i sine=frequency=660:sample_rate=48000 \
            -t 1 -shortest \
            -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -ac 1 -ar 48000 \
            evidence/source.mp4

      - name: Prove deterministic shell planning and source disclosure
        run: |
          ./target/release/video64-drop \
            --core-cli apps/video64-drop/cli.mjs \
            --headless-report evidence/shell-report-a.json \
            evidence/source.mp4
          ./target/release/video64-drop \
            --core-cli apps/video64-drop/cli.mjs \
            --headless-report evidence/shell-report-b.json \
            evidence/source.mp4
          cmp evidence/shell-report-a.json evidence/shell-report-b.json

      - name: Encode and verify through the native shell bridge
        run: |
          ./target/release/video64-drop \
            --core-cli apps/video64-drop/cli.mjs \
            --headless-encode evidence/source.mp4 evidence/output.v64 \
            --headless-report evidence/encode-report.json
          node prototype/js/cli.mjs verify evidence/output.v64 > evidence/verify.json

      - name: Exercise the real SDL2 window under Xvfb
        run: |
          xvfb-run -a env SDL_AUDIODRIVER=dummy \
            ./target/release/video64-drop \
            --core-cli apps/video64-drop/cli.mjs \
            --smoke-presents 4 \
            evidence/source.mp4

      - name: Assert native-shell evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          shell = json.loads(Path("evidence/shell-report-a.json").read_text())
          assert shell["format"] == "VIDEO64-DROP-NATIVE-SHELL-1"
          assert shell["capabilities"]["desktopShell"] is True
          assert shell["capabilities"]["dragAndDrop"] is True
          assert shell["settings"] == {
              "fps": "24",
              "columns": 80,
              "palette": 32,
              "glyphs": 32,
              "profile": "balanced",
          }
          assert len(shell["queue"]) == 1
          queued = shell["queue"][0]
          assert queued["grid"] == {"columns": 80, "rows": 23}
          assert queued["audioPresent"] is True
          assert any("audio" in warning.lower() for warning in queued["warnings"])

          encoded = json.loads(Path("evidence/encode-report.json").read_text())
          assert encoded["format"] == "VIDEO64-DROP-NATIVE-ENCODE-1"
          assert encoded["coreExitSuccess"] is True
          final = encoded["finalJob"]
          assert final["status"] == "completed"
          assert final["stages"]["audio_encode"]["state"] == "skipped"
          assert final["result"]["verification"]["valid"] is True
          assert final["result"]["verification"]["outputBytes"] > 0
          assert any(event.get("stage") == "verify" for event in encoded["events"])
          assert Path("evidence/output.v64").stat().st_size == final["result"]["verification"]["outputBytes"]

          verified = json.loads(Path("evidence/verify.json").read_text())
          assert verified["valid"] is True
          PY

      - name: Record checksums
        run: |
          sha256sum \
            target/release/video64-drop \
            evidence/source.mp4 \
            evidence/output.v64 \
            evidence/shell-report-a.json \
            evidence/encode-report.json \
            evidence/verify.json \
            > evidence/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: video64-drop-native-shell-evidence
          path: |
            target/release/video64-drop
            evidence/
          if-no-files-found: error
