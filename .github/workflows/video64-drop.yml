name: Video64 Drop application-core gate

on:
  pull_request:
    paths:
      - ".github/workflows/video64-drop.yml"
      - "apps/video64-drop/**"
      - "prototype/js/audio-am1.mjs"
      - "prototype/js/audio-decode.mjs"
      - "prototype/js/audio-opus.mjs"
      - "prototype/js/audio-run.mjs"
      - "prototype/js/cli.mjs"
      - "prototype/js/constants.mjs"
      - "prototype/js/container.mjs"
      - "prototype/js/palette-registry.mjs"
      - "prototype/js/source-geometry.mjs"
      - "prototype/js/video64.mjs"
      - "tests/video64-drop.test.mjs"
      - "tests/video64-drop-streaming-audio.test.mjs"
      - "tests/video64-drop-preview.test.mjs"
      - "tests/video64-drop-cli.test.mjs"
      - "docs/CURRENT_STATUS.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v64-video64-drop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Check application-core syntax
        run: |
          node --check apps/video64-drop/model.mjs
          node --check apps/video64-drop/audio.mjs
          node --check apps/video64-drop/preview.mjs
          node --check apps/video64-drop/runner.mjs
          node --check apps/video64-drop/cli.mjs
          node --check prototype/js/audio-am1.mjs

      - name: Run focused application-core tests
        run: npm --prefix apps/video64-drop test

      - name: Prove bounded streaming beyond the former PCM ceiling
        run: |
          mkdir -p target/video64-drop
          truncate -s 270720000 target/video64-drop/long-form-silence.pcm
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { writeFileSync } from "node:fs";
          import { encodeDropAudioFileTimeline } from "./apps/video64-drop/audio.mjs";

          const durationSeconds = 47 * 60;
          const durationTicks = durationSeconds * 60000;
          const encoded = encodeDropAudioFileTimeline(
            "target/video64-drop/long-form-silence.pcm",
            durationTicks,
            { scanReadBytes: 1024 * 1024 }
          );
          const summary = encoded.summary;
          assert.equal(summary.streaming, true);
          assert.equal(summary.strategy, "disk-spooled-two-pass");
          assert.equal(summary.wholeFilePcmBuffered, false);
          assert.equal(summary.spoolBytes, 270720000);
          assert.ok(summary.spoolBytes > 256 * 1024 * 1024);
          assert.equal(summary.maximumSourcePcmWorkingSetBytes, 5760000);
          assert.ok(summary.maximumSourcePcmWorkingSetBytes < 6 * 1024 * 1024);
          assert.equal(summary.targetSamples, 135360000);
          assert.equal(summary.audibleRuns, 0);
          assert.equal(summary.silenceSpans, 1);
          assert.equal(summary.silenceSamples, summary.targetSamples);
          assert.equal(encoded.chunks.length, 1);
          assert.equal(encoded.chunks[0].type, "SILN");
          assert.equal(encoded.chunks[0].timestamp, 0);
          assert.equal(encoded.chunks[0].duration, durationTicks);
          writeFileSync(
            "target/video64-drop/long-form-streaming.json",
            `${JSON.stringify({
              durationSeconds,
              durationTicks,
              formerCeilingBytes: 256 * 1024 * 1024,
              ...summary
            }, null, 2)}\n`
          );
          NODE
          rm target/video64-drop/long-form-silence.pcm

      - name: Build deterministic audiovisual sources
        run: |
          ffmpeg -y -v error \
            -f lavfi -i testsrc2=size=320x180:rate=24:duration=1 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac \
            target/video64-drop/source.mp4
          ffmpeg -y -v error \
            -f lavfi -i testsrc2=size=320x180:rate=24:duration=4 \
            -f lavfi -i sine=frequency=660:sample_rate=48000:duration=4 \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac \
            target/video64-drop/preview-source.mp4

      - name: Generate sampled estimate and decoded preview twice
        run: |
          node apps/video64-drop/cli.mjs estimate \
            target/video64-drop/preview-source.mp4 \
            --columns 40 --palette 16 --glyphs 32 --profile balanced \
            > target/video64-drop/estimate.json
          node apps/video64-drop/cli.mjs preview \
            target/video64-drop/preview-source.mp4 \
            target/video64-drop/preview-a \
            --columns 40 --palette 16 --glyphs 32 --profile balanced \
            > target/video64-drop/preview-a.json
          node apps/video64-drop/cli.mjs preview \
            target/video64-drop/preview-source.mp4 \
            target/video64-drop/preview-b \
            --columns 40 --palette 16 --glyphs 32 --profile balanced \
            > target/video64-drop/preview-b.json
          cmp target/video64-drop/preview-a/source.ppm \
              target/video64-drop/preview-b/source.ppm
          cmp target/video64-drop/preview-a/decoded-v64.ppm \
              target/video64-drop/preview-b/decoded-v64.ppm
          cmp target/video64-drop/preview-a/comparison.ppm \
              target/video64-drop/preview-b/comparison.ppm
          ffprobe -v error -show_entries stream=width,height \
            -of json target/video64-drop/preview-a/comparison.ppm \
            > target/video64-drop/comparison-probe.json

      - name: Require sampled estimate and decoded preview evidence
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync, writeFileSync } from "node:fs";

          const estimate = JSON.parse(readFileSync("target/video64-drop/estimate.json"));
          const preview = JSON.parse(readFileSync("target/video64-drop/preview-a.json"));
          const repeat = JSON.parse(readFileSync("target/video64-drop/preview-b.json"));
          const manifest = JSON.parse(readFileSync("target/video64-drop/preview-a/preview.json"));
          const probe = JSON.parse(readFileSync("target/video64-drop/comparison-probe.json"));

          assert.equal(estimate.format, "VIDEO64-DROP-SAMPLED-SIZE-1");
          assert.equal(estimate.advisory, true);
          assert.equal(estimate.estimate.exactPostEncodeVerificationRequired, true);
          assert.equal(estimate.samplePlan.sampleSeconds, 2);
          assert.equal(estimate.samplePlan.sampleCount, 3);
          assert.deepEqual(estimate.samplePlan.offsets, [0, 1, 2]);
          assert.equal(estimate.samples.length, 3);
          assert.equal(estimate.samples.every((sample) => sample.bytes > 0), true);
          assert.equal(
            estimate.samples.every((sample) => sample.storedBitsPerSecond > sample.bitsPerSecond),
            true
          );
          assert.ok(estimate.estimate.lowerBytes <= estimate.estimate.estimatedBytes);
          assert.ok(estimate.estimate.upperBytes >= estimate.estimate.estimatedBytes);
          assert.match(estimate.estimate.rangeMeaning, /not a statistical confidence interval/i);

          assert.equal(preview.format, "VIDEO64-DROP-PREVIEW-1");
          assert.equal(preview.advisory, true);
          assert.equal(preview.grid.columns, 40);
          assert.equal(preview.grid.rows, 11);
          assert.equal(preview.preview.layout.left, "source");
          assert.equal(preview.preview.layout.right, "decoded-v64");
          assert.equal(preview.preview.layout.gapPixels, 8);
          assert.equal(preview.preview.representativeOffsetSeconds, 1);
          assert.equal(preview.preview.width, 648);
          assert.equal(preview.preview.height, 176);
          assert.notEqual(preview.preview.source.sha256, preview.preview.decodedV64.sha256);
          assert.deepEqual(
            estimate.samples.map((sample) => sample.sha256),
            preview.samples.map((sample) => sample.sha256)
          );
          assert.deepEqual(
            preview.samples.map((sample) => sample.sha256),
            repeat.samples.map((sample) => sample.sha256)
          );
          assert.deepEqual(manifest, preview);
          assert.equal(probe.streams[0].width, 648);
          assert.equal(probe.streams[0].height, 176);

          for (const path of [
            "target/video64-drop/preview-a/source.ppm",
            "target/video64-drop/preview-a/decoded-v64.ppm",
            "target/video64-drop/preview-a/comparison.ppm"
          ]) {
            assert.equal(readFileSync(path).subarray(0, 2).toString("ascii"), "P6");
          }

          writeFileSync(
            "target/video64-drop/preview-evidence.json",
            `${JSON.stringify({
              samplePlan: estimate.samplePlan,
              sampleHashes: estimate.samples.map((sample) => sample.sha256),
              estimate: estimate.estimate,
              preview: preview.preview
            }, null, 2)}\n`
          );
          NODE

      - name: Inspect and encode through Video64 Drop twice
        run: |
          node apps/video64-drop/cli.mjs inspect \
            target/video64-drop/source.mp4 \
            --columns 40 --palette 16 \
            > target/video64-drop/analysis.json
          node apps/video64-drop/cli.mjs encode \
            target/video64-drop/source.mp4 \
            target/video64-drop/output.v64 \
            --columns 40 --palette 16 --glyphs 32 --profile balanced \
            > target/video64-drop/job.json \
            2> target/video64-drop/events.ndjson
          node apps/video64-drop/cli.mjs encode \
            target/video64-drop/source.mp4 \
            target/video64-drop/output-repeat.v64 \
            --columns 40 --palette 16 --glyphs 32 --profile balanced \
            > target/video64-drop/job-repeat.json \
            2> target/video64-drop/events-repeat.ndjson
          cmp target/video64-drop/output.v64 target/video64-drop/output-repeat.v64
          node apps/video64-drop/cli.mjs encode \
            target/video64-drop/preview-source.mp4 \
            target/video64-drop/preview-actual.v64 \
            --columns 40 --palette 16 --glyphs 32 --profile balanced \
            > target/video64-drop/preview-actual-job.json \
            2> target/video64-drop/preview-actual-events.ndjson

      - name: Require audiovisual stage and output evidence
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync, writeFileSync } from "node:fs";
          import { decodeAudioTimelineToPcm } from "./prototype/js/audio-decode.mjs";
          import { demuxV64 } from "./prototype/js/container.mjs";

          const analysis = JSON.parse(readFileSync("target/video64-drop/analysis.json"));
          const job = JSON.parse(readFileSync("target/video64-drop/job.json"));
          const repeat = JSON.parse(readFileSync("target/video64-drop/job-repeat.json"));
          const estimate = JSON.parse(readFileSync("target/video64-drop/estimate.json"));
          const actual = JSON.parse(readFileSync("target/video64-drop/preview-actual-job.json"));
          const events = readFileSync("target/video64-drop/events.ndjson", "utf8")
            .trim().split("\n").map(JSON.parse);
          assert.equal(analysis.source.audioPresent, true);
          assert.equal(analysis.grid.columns, 40);
          assert.equal(analysis.capabilities.audioEncoding, true);
          assert.equal(analysis.capabilities.sampledSizeEstimator, true);
          assert.equal(analysis.capabilities.decodedPreview, true);
          assert.equal(job.status, "completed");
          assert.equal(repeat.status, "completed");
          assert.equal(job.settings.fps, "24");
          assert.equal(job.settings.glyphs, 32);
          assert.equal(job.stages.audio_encode.state, "completed");
          assert.equal(job.stages.mux.state, "completed");
          assert.equal(job.stages.verify.state, "completed");
          assert.equal(job.result.encoded.audio.sourcePresent, true);
          assert.equal(job.result.encoded.audio.normative, false);
          assert.equal(job.result.encoded.audio.streaming, true);
          assert.equal(
            job.result.encoded.audio.strategy,
            "disk-spooled-two-pass"
          );
          assert.equal(job.result.encoded.audio.wholeFilePcmBuffered, false);
          assert.equal(
            job.result.encoded.audio.maximumSourcePcmWorkingSetBytes,
            5760000
          );
          assert.ok(
            job.result.encoded.audio.maximumSourcePcmWorkingSetBytes <
              6 * 1024 * 1024
          );
          assert.ok(job.result.encoded.audio.audibleRuns > 0);
          assert.ok(job.result.encoded.audio.opusPackets > 0);
          assert.deepEqual(job.result.encoded.audio, repeat.result.encoded.audio);
          assert.ok(job.result.encoded.bytes > job.result.encoded.videoOnlyBytes);
          assert.equal(
            job.result.encoded.videoOnlyBitsPerSecond,
            job.result.encoded.videoOnlyBytes * 8
          );
          assert.equal(
            job.result.encoded.bitsPerSecond,
            job.result.encoded.bytes * 8
          );
          assert.equal(
            job.result.encoded.bytesPerMinute,
            job.result.encoded.bytes * 60
          );
          assert.equal(job.result.verification.valid, true);
          assert.equal(job.result.verification.outputBytes, job.result.encoded.bytes);
          assert.deepEqual(job.result.verification, repeat.result.verification);
          assert.ok(job.result.verification.audioRuns > 0);
          assert.ok(job.result.verification.audioKeptSamples > 0);
          assert.equal(job.warnings.length, 1);
          assert.equal(events.some((event) => event.stage === "video_encode"), true);
          assert.equal(events.some((event) => event.stage === "audio_encode"), true);
          assert.equal(events.some((event) => event.stage === "verify"), true);

          assert.equal(actual.status, "completed");
          assert.equal(actual.result.verification.valid, true);
          const estimatedBytes = estimate.estimate.estimatedBytes;
          const actualBytes = actual.result.verification.outputBytes;
          const relativeError = Math.abs(estimatedBytes - actualBytes) / actualBytes;
          writeFileSync(
            "target/video64-drop/estimate-evaluation.json",
            `${JSON.stringify({
              advisory: true,
              estimatedBytes,
              lowerBytes: estimate.estimate.lowerBytes,
              upperBytes: estimate.estimate.upperBytes,
              actualVerifiedBytes: actualBytes,
              relativeError
            }, null, 2)}\n`
          );

          const demuxed = demuxV64(readFileSync("target/video64-drop/output.v64"));
          const decoded = decodeAudioTimelineToPcm(demuxed);
          assert.ok(decoded);
          assert.equal(decoded.samples, 48000);
          assert.equal(decoded.pcm.length, 96000);
          assert.equal(decoded.pcm.some((byte) => byte !== 0), true);
          writeFileSync("target/video64-drop/decoded-audio.pcm", decoded.pcm);
          writeFileSync(
            "target/video64-drop/audio-decode.json",
            `${JSON.stringify({
              samples: decoded.samples,
              bytes: decoded.pcm.length,
              sha256: decoded.sha256,
              runs: decoded.runs,
              silenceSpans: decoded.silenceSpans
            }, null, 2)}\n`
          );
          NODE
          node prototype/js/cli.mjs verify target/video64-drop/output.v64 \
            > target/video64-drop/proof-verification.json

      - name: Upload application-core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video64-drop-application-core-evidence
          if-no-files-found: error
          retention-days: 30
          path: target/video64-drop
