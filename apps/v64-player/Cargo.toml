[package]
name = "v64-player"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Bounded native Video 64 player"

[dependencies]
opus = { version = "=0.3.1", optional = true }
sdl2 = { version = "=0.38.0", optional = true }
serde_json = "1"
v64-core = { path = "../../crates/v64-core" }

[features]
default = []
native-audio = ["dep:opus"]
native-ui = ["dep:sdl2", "native-audio"]

[[bin]]
name = "v64-player"
path = "src/main.rs"
required-features = ["native-ui"]

[lints]
workspace = true
